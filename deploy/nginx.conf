#
# The nginx-accel edge driver (SPEC 11.3, ADR 0001).
#
# 🛑 An EQUAL alternative, not a fallback. SPEC 11.3: "nginx + php-fpm is an
# equal alternative (`nginx-accel` driver, using `X-Accel-Redirect` into an
# `internal` location) behind one `ArtifactHandoff` interface, implemented from
# day one and run as a CI matrix leg, not merely documented."
#
# 🛑 And it carries a compensating control that Caddy does not need. ADR 0001
# measured nginx replacing the ENTIRE response header set on an internal
# redirect, dropping the application's `Cache-Control: private, no-store`,
# `Vary: Cookie`, CSP, `Link` and `X-Robots-Tag`. A private document would then
# be served cacheable behind a correct-looking 200 — SPEC 9.3.2's failure,
# silently. Every header in the re-emission block below is therefore mandatory,
# and `tests/Feature/Serving/HandoffHeaderParityTest.php` asserts that this list
# matches `ArtifactHandoff::PRESERVED_HEADERS` exactly. If you add a
# security-relevant header to the serving path, add it in both places or the
# test fails — which is the point.

server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    # SPEC 9.3.8: nginx defaults `disable_symlinks` to off. A symlink inside an
    # artifact tree is already refused at ingest (SPEC 8.8.2), so this is defence
    # in depth against anything that reaches the tree by another route — a
    # restore, an operator's rsync, a future import path.
    disable_symlinks on;

    # The artifact tree is never a PHP document root (SPEC 8.9.8). Stated as a
    # rule here because the `internal` location below shares no config with the
    # PHP handler, and the two must not be merged for tidiness.
    client_max_body_size 5G;

    # SPEC 8.9.13: compress on the fly when no sidecar exists. The sidecar path
    # is chosen by the application and served by the internal location above;
    # this is the fallback for everything else.
    #
    # 🛑 `gzip_vary on` so a compressed response carries Vary: Accept-Encoding.
    # Without it a shared cache can hand compressed bytes to a client that did
    # not ask for them. The application sets Vary itself on the handoff path;
    # this covers the responses nginx compresses on its own.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # SPEC 8.10.18: the ACME challenge path is matched before everything else,
    # including the documentation catch-all. Phase 19 wires issuance.
    location ^~ /.well-known/acme-challenge/ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # The artifact byte handoff (SPEC 8.9.8).
    # -------------------------------------------------------------------------
    #
    # 🛑 `internal` is what makes this externally unreachable. A reader who could
    # request /_internal/... directly would bypass every authorisation decision
    # the application had just made, which is the whole of the handoff's value.
    location /_internal/ {
        internal;

        alias /var/lib/docup/artifacts/;

        disable_symlinks on;

        # 🛑 SPEC 8.9.8: "strips `Cookie` and `Authorization` toward storage".
        # The artifact root is a filesystem here, so nothing is sent onward —
        # but the driver is also used with an object-store upstream, and a
        # credential forwarded to one is a credential in somebody's access log.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        # 🛑 SPEC 8.9.8: "ignores internal-redirect headers returned by the
        # storage upstream (nginx honours `X-Accel-*` from ANY upstream)".
        # Without this, an artifact whose bytes happened to be served with an
        # X-Accel-Redirect header could redirect the handoff a second time — to
        # any path nginx can reach. The artifact tree is attacker-supplied
        # content, so this is not hypothetical.
        proxy_hide_header X-Accel-Redirect;
        proxy_hide_header X-Accel-Buffering;
        proxy_hide_header X-Accel-Charset;
        proxy_hide_header X-Accel-Expires;
        proxy_hide_header X-Accel-Limit-Rate;

        # Never leak the application's own fingerprint through the handoff.
        proxy_hide_header X-Powered-By;

        # ---------------------------------------------------------------------
        # 🛑 THE RE-EMISSION LIST (SPEC 8.9.8, SPEC 18.18).
        # ---------------------------------------------------------------------
        #
        # 🛑 This list is MEASURED, not derived from the header set the
        # application sets, and the difference is the whole content of this
        # comment. SPEC 18.18 records that nginx "replaces the entire response
        # header set" on an internal redirect. Measured on nginx 1.27.5, that is
        # too broad, and re-emitting on that assumption is itself a defect:
        # `add_header` APPENDS, so re-emitting a header nginx already kept
        # produces two of them, and SPEC 8.9.8 requires each exactly once.
        #
        # What nginx 1.27.5 actually does with an internal redirect to a file:
        #
        #   KEPT from the upstream — MUST NOT be re-emitted here:
        #     Cache-Control, Content-Type, Content-Disposition
        #
        #   REPLACED with the file's own — deliberately left to nginx:
        #     ETag, Last-Modified. SPEC 8.9.8 says the handoff is what "buys
        #     ETags, If-None-Match and Range from the web server", so the web
        #     server owning them is the intent, not a loss. Re-emitting the
        #     application's would send two ETags and break conditional
        #     requests, which is worse than either value alone.
        #
        #   OVERWRITTEN by nginx's own gzip filter — re-emitted, with the
        #   filter's version suppressed below:
        #     Vary
        #
        #   DROPPED — re-emission is load-bearing:
        #     CDN-Cache-Control, Cache-Tag, X-Content-Type-Options,
        #     Content-Encoding, and the headers in the same custom class
        #     (Content-Security-Policy, Link, X-Robots-Tag).
        #
        # 🛑 The dropped list is where SPEC 9.3.2 actually breaks, and it was
        # measured breaking: a `members` document served through this location
        # with no re-emission kept `Cache-Control: no-store, private` and lost
        # `CDN-Cache-Control` entirely — a private document reaching a CDN with
        # nothing on the CDN axis telling it not to store, behind a correct 200.
        # SPEC 18.18 is right about the consequence and wrong about the
        # mechanism, which is why this is written from a measurement.
        #
        # 🛑 `gzip_vary off` because the application already states Vary
        # (SPEC 8.9.13 puts Accept-Encoding in it) and nginx's filter sets its
        # own. Two Vary headers are legal only with DISTINCT values (SPEC
        # 8.9.8), and these overlap. Worse, without the re-emission below the
        # filter's `Vary: Accept-Encoding` REPLACES the application's
        # `Vary: Cookie, Accept-Encoding`, dropping the Cookie axis that
        # SPEC 9.3.2 requires on a private response.
        gzip_vary off;
        #
        # `always` matters on every one of these: without it nginx omits the
        # header on a 304 and on an error, and a 304 for a private document
        # with no `private, no-store` is the same leak as a 200 with none.
        #
        # Keep in step with ArtifactHandoff::NGINX_REEMITTED_HEADERS, which a
        # test asserts against this file in both directions.
        add_header CDN-Cache-Control        $upstream_http_cdn_cache_control        always;
        add_header Vary                     $upstream_http_vary                     always;
        add_header Cache-Tag                $upstream_http_cache_tag                always;
        add_header Content-Security-Policy  $upstream_http_content_security_policy  always;
        add_header Content-Encoding         $upstream_http_content_encoding         always;
        add_header Link                     $upstream_http_link                     always;
        add_header X-Robots-Tag             $upstream_http_x_robots_tag             always;
        add_header X-Content-Type-Options   $upstream_http_x_content_type_options   always;
    }

    # -------------------------------------------------------------------------
    # The application.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 🛑 SPEC 8.9.5: the edge strips these unconditionally, inbound. A
        # request arriving with X-Accel-Redirect set would otherwise reach the
        # application as a trusted-looking value, and one arriving with
        # X-DocUp-Project is the GHSA-mp38-vprc-7hf5 class SPEC 8.9.4 names.
        fastcgi_param HTTP_X_ACCEL_REDIRECT   "";
        fastcgi_param HTTP_X_ACCEL_BUFFERING  "";
        fastcgi_param HTTP_X_DOCUP_PROJECT    "";
        fastcgi_param HTTP_X_DOCUP_VERSION    "";
        fastcgi_param HTTP_X_DOCUP_RESOLVER   "";
        fastcgi_param HTTP_X_FORWARDED_HOST   "";
        fastcgi_param HTTP_X_CLIENT_CERT      "";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # -------------------------------------------------------------------------
    # 🛑 SPEC 8.12.13's TIER B, commented out, and the comment is the delivery.
    # -------------------------------------------------------------------------
    #
    #   "**Tier B (scale, no edge scripting):** plain nginx `auth_request` with
    #    a cached subrequest keyed on an **opaque** cache-key cookie carrying no
    #    session material, so one PHP call authorises a 60-asset page. The authz
    #    endpoint emits only 2xx/401. 🛑 With a php-fpm upstream the directive
    #    family is **`fastcgi_cache`**, not `proxy_cache`; the cache key MUST
    #    combine host, opaque cookie and directory, and the **401 MUST be cached
    #    too** or an unauthenticated crawler costs one PHP call per asset."
    #
    # Shipped commented rather than live because SPEC 8.12.13 makes Tier A the
    # default — "Nothing at the edge to misconfigure" — and because turning this
    # on without the `fastcgi_cache_path` below produces an nginx that starts and
    # authorises every asset separately, which looks like Tier B and is Tier A
    # with extra latency.
    #
    # 🛑 THREE things here are load-bearing and each has cost somebody a day:
    #
    #  1. `fastcgi_cache`, NOT `proxy_cache`. ADR 0005 measured it: with a
    #     php-fpm upstream the `proxy_*` family does nothing at all, silently.
    #     There is no warning, no log line and no cache hit — just one PHP call
    #     per asset and an operator who believes they are running Tier B.
    #
    #  2. The key is host + opaque cookie + DIRECTORY. The host because SPEC
    #     9.3.3 puts it in every cache key; the cookie because that is the
    #     reader; the directory rather than the file because that is what makes
    #     one authorisation cover a page's sixty assets. A key including the
    #     filename caches sixty verdicts and saves nothing.
    #
    #  3. `fastcgi_cache_valid 401` — the 401 is cached too. Without it an
    #     anonymous crawler on a private project costs one PHP invocation per
    #     asset, which is the DDoS shape SPEC 9.3.5 is about: Read the Docs'
    #     June 2026 incident was aimed precisely at the uncacheable paths.
    #
    # 🛑 And `error_page 401 = @docup_denied`. SPEC 8.12.24: "The Tier B
    # subrequest endpoint's 2xx/401 vocabulary is an internal protocol between
    # the application and the proxy and MUST NOT leak a 401 to a client that
    # SPEC 8.12.23 says gets a 404." Wiring the 401 straight through would
    # publish the existence of every private project.
    #
    # To enable: uncomment, add the cache path to the http{} block, and set
    # DOCUP_ENFORCEMENT_TIER=b so `docup:doctor` reports the tier you are on.
    #
    #   # in http{}:
    #   fastcgi_cache_path /var/cache/nginx/docup-authz levels=1:2
    #       keys_zone=docup_authz:16m inactive=10m max_size=256m;
    #
    #   location = /_/authz {
    #       internal;
    #       fastcgi_pass app:9000;
    #       fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    #       fastcgi_param REQUEST_METHOD GET;
    #       # The document's URI, which the subrequest's own URI is not.
    #       fastcgi_param QUERY_STRING "uri=$request_uri";
    #       include fastcgi_params;
    #
    #       fastcgi_cache docup_authz;
    #       # 🛑 host + opaque cookie + directory. See note 2 above.
    #       fastcgi_cache_key "$host|$cookie___Host_docup_ck|$docup_authz_dir";
    #       fastcgi_cache_valid 200 204 5m;
    #       # 🛑 See note 3: the refusal is cached too.
    #       fastcgi_cache_valid 401 30s;
    #       fastcgi_cache_use_stale off;
    #       # A reader with no cookie at all shares one cache entry, which is
    #       # correct: they are all the same anonymous reader.
    #       fastcgi_ignore_headers Set-Cookie;
    #   }
    #
    #   # The directory of the requested path, as the cache key's third part.
    #   map $uri $docup_authz_dir {
    #       ~^(?<dir>.*/)[^/]*$  $dir;
    #       default              /;
    #   }
    #
    #   # Then, on the documentation location:
    #   #   auth_request /_/authz;
    #   #   error_page 401 = @docup_denied;
    #
    #   location @docup_denied {
    #       # 🛑 Back to the application, which answers SPEC 8.12.23's
    #       # deny_status with no WWW-Authenticate. NOT `return 401`.
    #       try_files /nonexistent /index.php?$query_string;
    #   }
}
