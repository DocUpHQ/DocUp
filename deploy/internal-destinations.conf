#
# Operator-declared internal destinations (SPEC 8.3.9, SPEC 8.10.14).
#
# 🛑 SHIPPED EMPTY. Every line you add weakens one control for one hostname,
# so add a line only for a host you run.
#
# WHAT THIS IS FOR
#
# SPEC 8.3.9 routes every outbound request through one hardened client that
# refuses private, loopback, link-local and cloud-metadata addresses. SPEC
# 8.10.14 requires support for "an internal ACME directory (step-ca, Vault,
# ADCS) for air-gapped and corporate-PKI installations" — and such a directory
# is, by definition, on a private address.
#
# Both requirements cannot hold as written. This file is the narrowest
# resolution: name the exact hostnames that are your own infrastructure, and
# DocUp will accept a private address for those names and nothing else.
#
# WHAT A LINE DOES, AND WHAT IT DOES NOT
#
#   ✅ Permits    RFC 1918 (10/8, 172.16/12, 192.168/16) and IPv6 unique-local
#                 (fc00::/7) answers, for that exact hostname.
#
#   🛑 Still refused, for these hostnames as for every other:
#                 - loopback (127.0.0.0/8, ::1)  — services inside this container
#                 - link-local (169.254.0.0/16)  — the cloud metadata address
#                 - unspecified and reserved ranges
#
#   🛑 Exact names only. `ca.internal` does NOT admit `evil.ca.internal`. If
#      you need both, write both. A suffix rule would let one declared name
#      widen into a zone somebody else controls.
#
#   🛑 Hostnames only. An IP literal on a line is ignored: a name at least has
#      to resolve, which is what leaves the rebind check something to compare.
#
# Everything else about the egress client is unchanged for these hosts: HTTPS
# only, certificate verification on, redirects refused, a 5-second timeout and
# a 256 KiB cap.
#
# FORMAT
#
# One hostname per line. Blank lines and lines beginning with # are ignored.
#
# EXAMPLE (commented out)
#
#   step-ca.corp.internal
#   vault.corp.internal
