#
# The §8.5.9 egress allowlist: every host a build container may reach.
#
#   "Egress MUST default to an allowlisted CONNECT proxy (PyPI, npm,
#    crates.io, `proxy.golang.org`, rubygems.org, configured git hosts,
#    operator additions) plus an nftables backstop inside the build network
#    namespace so proxy bypass still fails at layer 3. TLS MUST NOT be
#    intercepted."
#
# 🛑 ONE FILE, TWO READERS, and that is the point. The proxy renders its
# squid configuration from this file at start-up, and the application reads
# the same file for `docup:doctor`, for the §8.5.12 boot self-test and for
# the message an author sees when a host is refused. A second copy of the
# list in PHP would drift from the one the proxy enforces, and the drift
# would be invisible until the day an author was told a host was allowed by
# a proxy that was refusing it.
#
# Format: one hostname per line. Blank lines and `#` comments are ignored.
#
# 🛑 EXACT HOSTNAMES ONLY. A leading dot (`.example.com`) is squid's
# subdomain-wildcard syntax and is REFUSED by the renderer, because a
# wildcard entry hands every host anybody can register under that name to
# every build on the installation — and the package-index entries below are
# precisely the names an attacker would like a sibling of.
#
# Operators add hosts by appending to this file and restarting the proxy.
# Every addition is a deliberate, diffable act in configuration management
# rather than an environment variable edited at 2am (§20.4's reasoning,
# applied to a list rather than a flag).

# --- Python: PyPI ------------------------------------------------------------
pypi.org
files.pythonhosted.org

# --- JavaScript: npm ---------------------------------------------------------
registry.npmjs.org

# --- Rust: crates.io ---------------------------------------------------------
crates.io
index.crates.io
static.crates.io

# --- Go ----------------------------------------------------------------------
proxy.golang.org
sum.golang.org

# --- Ruby: RubyGems ----------------------------------------------------------
rubygems.org
index.rubygems.org

# --- Configured git hosts (§8.3.1's five providers) --------------------------
# 🛑 The `fetch` stage reaches these; the `build` stage normally does not.
# They are listed once rather than per stage because the proxy has no way to
# tell the two apart — the stage distinction is enforced by which container
# is given a proxy at all (§8.5.9), not by the allowlist.
github.com
codeload.github.com
gitlab.com
bitbucket.org
codeberg.org
gitea.com

# --- Operator additions ------------------------------------------------------
# Append below. A self-hosted GitLab, Gitea or Forgejo belongs here, as does
# an internal package mirror. Nothing else in DocUp needs editing.
