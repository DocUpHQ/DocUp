#
# §8.3.9's operator-declared internal destinations, for the OIDC integration
# overlay ONLY.
#
# 🛑 This file is bind-mounted over deploy/internal-destinations.conf by
# compose.oidc.yaml. The committed file stays **empty**, and
# `EgressConfigurationTest::test_the_shipped_destination_file_declares_nothing`
# asserts that it does — so a setup script that edited the committed allowlist
# would make the shipped default wrong in order to test something else.
#
# `deploy/tls-test-setup.sh` makes the same argument for Pebble and resolves it
# differently: `AcmeIssuanceTest::setUp()` sets the config value, because that
# suite runs in the test process. This flow runs through the **FPM worker** — a
# reader's login is a real HTTP request — so a test-process config change would
# not reach the code under test, and a mount is the narrowest thing that does.
#
# One line, and everything else about the egress client is unchanged for it:
# HTTPS only, certificate verification on, redirects refused, the byte cap and
# the timeout. Loopback and link-local stay refused even here.
keycloak
