#
# SPEC 8.10.22: the ONE allowlist of response headers an operator may set per
# domain, shared between the application and the proxy.
#
# "Per-domain custom response headers MUST be restricted to a single shared
# allowlist constant, asserted byte-identical between the application and the
# proxy configuration by an automated test."
#
# Byte-identical, not merely equivalent: HeaderAllowlistTest compares this
# file against App\Domains\HeaderAllowlist::NAMES character for character. Two
# lists that agree today and are edited in one place tomorrow are the failure
# the requirement is written against -- a header the application accepts and
# the proxy strips looks like a bug in the operator's configuration, and a
# header the proxy passes and the application never validated is an injection
# point.
#
# One lowercase name per line. Comments and blank lines are ignored by both
# readers. Nothing here may be a header DocUp itself sets on the serving path
# (SPEC 8.9.8's preserved set) or a hop-by-hop header, because an operator
# overriding one of those is overriding an authorisation or caching decision
# rather than decorating a response.

content-security-policy
content-security-policy-report-only
cross-origin-embedder-policy
cross-origin-opener-policy
cross-origin-resource-policy
permissions-policy
referrer-policy
report-to
x-dns-prefetch-control
x-frame-options
x-permitted-cross-domain-policies
