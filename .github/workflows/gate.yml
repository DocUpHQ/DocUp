# SPDX-FileCopyrightText: 2026 The DocUp contributors
# SPDX-License-Identifier: Apache-2.0
#
# The SPEC 9.4 baseline gate. Every phase passes this.
#
# 🛑 Phase 01's exit criteria require that CI goes RED on each of: a planted
# Larastan violation, a planted second AUTO_INCREMENT, an unclassified column,
# and a lowered gate threshold. The jobs below are arranged so each of those is
# caught by a named step rather than incidentally.
#
# ADR 0001: both edge drivers run as a CI matrix leg, not one as a documented
# alternative, because five load-bearing serving assumptions were unverified and
# building both is what makes a failed assumption a configuration change.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 🛑 Composer's dist downloads come from `api.github.com`, and unauthenticated
# requests to it are rate-limited per runner IP. Four consecutive runs in Phase
# 26a failed `Install dependencies` with `curl error 28 Operation timed out` and
# `curl error 56 Connection died` on zipball URLs — in a different job each
# time, which is what a shared quota looks like.
#
# Handing Composer the workflow's own token raises the limit from 60 requests an
# hour to 1000 and removes the class. It is `secrets.GITHUB_TOKEN`: scoped to
# this repository, expiring with the job, and already the token
# `actions/checkout` used — so this grants nothing that was not already granted.
#
# 🛑 At workflow level because there are three `composer install` sites and a
# per-step version is a list somebody forgets to extend — the same argument the
# MFA middleware carries for being on the whole web group. The containerised
# site needs it passed through explicitly; see that step.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

  # 🛑 AND the parallelism, which is what actually fixes it. The token above was
  # the first diagnosis and it was wrong: authentication raises the REQUEST
  # quota, and the next run failed the same way with 87 dropped downloads in one
  # job — `curl error 56 Connection died` eighty-one times and `curl error 28`
  # six times. Many packages failing at once, not a sequence of refusals.
  #
  # That is a CONNECTION-level fault, not a quota one. Composer's downloader
  # opens 12 simultaneous HTTP connections by default, and `api.github.com`
  # drops some of them under that load from a shared runner IP — which also
  # explains why it struck a different job each run and why the token made no
  # difference.
  #
  # Six halves the concurrency. The token stays because it is correct on its own
  # terms and costs nothing: a higher request quota is worth having whether or
  # not it was the cause.
  COMPOSER_MAX_PARALLEL_HTTP: '6'

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:

  baseline:
    name: baseline gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        # SPEC 11.1: MySQL 8.4 LTS. 8.0 reached end of life in April 2026.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: docup-root
          MYSQL_DATABASE: docup_test
          MYSQL_USER: docup
          MYSQL_PASSWORD: docup
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdocup-root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # ADR 0007: the floor is 8.4.1. Dom\HTMLDocument is a language-level
          # requirement of the section extractor and is absent in 8.3.
          php-version: '8.4'
          # curl is explicit from Phase 05: the SPEC 8.3.9 egress client owns
          # its own cURL handle rather than inheriting Guzzle's defaults, so
          # ext-curl is a composer requirement and not an incidental.
          extensions: pdo_mysql, intl, zip, gd, bcmath, sodium, pcntl, curl
          coverage: none
          tools: composer:v2

          # 🛑 The same upload limits the deployment images set, because CI runs
          # the upload API tests and setup-php ships PHP's 2M/8M defaults. Left
          # at the defaults, CI exercises the direct upload API against a PHP
          # that would reject anything over 2 MB with a 413 the application
          # never sees -- which is the exact defect SPEC 8.21.6 and
          # HandoffHeaderParityTest exist to catch, running green in CI.
          #
          # This matches the environment to what the test asserts; it does not
          # relax what is asserted. Lowering the cap or weakening the assertion
          # would be routing around the gate (CLAUDE.md rule 4).
          ini-values: upload_max_filesize=1G, post_max_size=1G, memory_limit=512M


      # 🛑 This MUST precede `composer install`, and the order is not cosmetic.
      # Laravel's post-autoload-dump script runs `artisan package:discover`,
      # which BOOTS the application - and AppServiceProvider asserts the
      # SPEC 8.1.4 origin separation at boot. With no .env there are no origins
      # to separate, so the assertion throws and `composer install` exits 1.
      # That is the guard working correctly; CI simply has to give it an
      # environment before it runs. Do not move this below the install step.
      - name: Provide an environment file before anything boots the app
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      # 🛑 Exit criterion: a planted Larastan violation turns CI red.
      - name: Static analysis, level 8 repo-wide
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Static analysis, level 9 on the strict namespaces
        run: ./vendor/bin/phpstan analyse -c phpstan-strict.neon --no-progress --memory-limit=1G

      # 🛑 The tests that render the login page need the Vite manifest, and
      # /public/build/ is correctly gitignored - so it exists on a developer's
      # machine and never in a fresh checkout. That asymmetry is why the suite
      # passed locally and failed here with "Vite manifest not found".
      #
      # Building rather than stubbing the manifest out with withoutVite() is
      # the deliberate choice: it keeps the tests rendering the real page, and
      # it means a broken front-end build fails the gate instead of shipping.
      # Nothing else in CI compiles the front end.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build the front end
        run: |
          npm ci
          npm run build

      # 🛑 SPEC 9.5.1: "WCAG 2.2 AA for the dashboard, the default
      # documentation theme and all injected chrome, with axe reporting ZERO
      # violations in CI." SPEC 17's Phase 27 exit criterion restates it.
      #
      # The target is SPEC 8.14.14's reference example theme, rendered —
      # generated by `docup:branding-reference` from the real registry, the
      # real default palette and the real chrome stylesheet, so this is an axe
      # run over markup the application produces rather than over a fixture
      # written for the checker. `BrandingRegistryTest` asserts the committed
      # file matches what the application emits, so the two cannot drift.
      #
      # 🛑 A CI STEP rather than a Pest test, deliberately. axe is a Node tool;
      # a test that skipped when Node was absent would be a skipped test, and
      # CLAUDE.md rule 4 says no phase is complete with one.
      #
      # 🛑 The `color-contrast` rule is DISABLED in that script and the file
      # says why: jsdom resolves neither CSS custom properties nor inheritance
      # well enough for axe's answer to mean anything, so it reports
      # `incomplete` rather than `pass`. Contrast is SPEC 8.14.5's own gate,
      # which computes WCAG ratios from the parsed token values over a fixed
      # matrix in both colour schemes and refuses publication below 3:1.
      # Reporting an `incomplete` as a pass would be a green run that checked
      # nothing.
      - name: Accessibility (axe, WCAG 2.2 AA)
        run: npm run axe

      - name: Prepare the application
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: docup_test
        run: |
          php artisan key:generate
          php artisan migrate --force

      # 🛑 SPEC 8.22.1: make the audit log append-only to the application.
      #
      # Runs the SAME scripts an operator applies, rather than a CI-only
      # approximation — otherwise CI would test an unhardened schema and
      # tests/Feature/AuditAppendOnlyTest.php would assert against a
      # configuration no installation uses. The service container does not
      # mount docker-entrypoint-initdb.d, so it is applied by hand here.
      #
      # The script is schema-agnostic, so this is the production file run
      # verbatim against the schema the suite uses. An earlier version created
      # an empty `docup` database to satisfy a hardcoded schema name and failed
      # with "Table 'docup.audit_anchors' doesn't exist" — testing a script that
      # is not the one operators run is worse than not testing it.
      - name: Harden the audit log
        env:
          MYSQL_PWD: docup-root
        run: |
          mysql -h 127.0.0.1 -u root docup_test < deploy/mysql/init/10-audit-append-only.sql

      # 🛑 Exit criteria: the architecture suite is what turns a planted second
      # AUTO_INCREMENT, a stray unsafe flag, a reappearing key cast or a missing
      # SPDX header into a red build.
      - name: Architecture invariants
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: docup_test
        run: ./vendor/bin/pest --testsuite=Arch

      # On failure the output is re-emitted as a GitHub annotation, not only
      # left in the log. GitHub requires a signed-in session to read Actions
      # logs even on a public repository, so for anyone looking at a run
      # anonymously - a contributor checking whether main is green before
      # forking, or a maintainer on a borrowed machine - the log is invisible
      # and "Process completed with exit code 1" is all they get. Annotations
      # are public, so the reason travels with the failure.
      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: docup_test
          NO_COLOR: '1'
        run: |
          set -o pipefail
          if php artisan test --colors=never 2>&1 | tee /tmp/tests.log; then
            exit 0
          fi
          # Annotations take one line, so newlines are percent-encoded per the
          # workflow-command format. Order matters: % first, or the encodings
          # of the others get re-encoded.
          encoded="$(
            tail -c 4000 /tmp/tests.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'
          )"
          echo "::error title=Test failures::${encoded}"
          exit 1

      - name: Dependency audit
        run: composer audit --locked --abandoned=report

  # 🛑 Exit criterion: a LOWERED gate threshold turns CI red. CODEOWNERS makes
  # a human read the change; this makes the machine refuse it. Two independent
  # controls, because the failure mode is a phase under time pressure lowering
  # the bar instead of fixing the code, and that phase is reviewing its own PR.
  thresholds:
    name: gate thresholds did not decrease
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare thresholds against the base branch
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"

          extract() {
            # phpstan level, and the numeric gate thresholds from config/docup.php
            {
              git show "$1:phpstan.neon"        2>/dev/null | sed -n 's/^ *level: *\([0-9]*\).*/phpstan_level=\1/p'
              git show "$1:phpstan-strict.neon" 2>/dev/null | sed -n 's/^ *level: *\([0-9]*\).*/phpstan_strict_level=\1/p'
              git show "$1:config/docup.php"    2>/dev/null | sed -n "s/.*'mutation_min_score' *=> *\([0-9]*\).*/mutation_min_score=\1/p"
            } | sort
          }

          extract "$base" > /tmp/before.txt
          extract HEAD     > /tmp/after.txt

          echo "--- base ---";  cat /tmp/before.txt
          echo "--- head ---";  cat /tmp/after.txt

          failed=0
          while IFS='=' read -r key before; do
            after=$(sed -n "s/^${key}=//p" /tmp/after.txt | head -1)
            if [ -z "$after" ]; then
              echo "::error::gate threshold [$key] was REMOVED (was $before)"
              failed=1
            elif [ "$after" -lt "$before" ]; then
              echo "::error::gate threshold [$key] DECREASED: $before -> $after (SPEC 9.4)"
              failed=1
            fi
          done < /tmp/before.txt

          exit "$failed"

  # 🛑 SPEC 8.22.7: CI fails when an unclassified column is introduced. This is
  # what makes the erasure and export promises provable rather than asserted.
  data-classification:
    name: every column is classified
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: docup-root
          MYSQL_DATABASE: docup_test
          MYSQL_USER: docup
          MYSQL_PASSWORD: docup
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdocup-root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # curl is explicit from Phase 05: the SPEC 8.3.9 egress client owns
          # its own cURL handle rather than inheriting Guzzle's defaults, so
          # ext-curl is a composer requirement and not an incidental.
          extensions: pdo_mysql, intl, zip, gd, bcmath, sodium, pcntl, curl
          coverage: none
          tools: composer:v2


      # Before composer install, for the reason given in the baseline job:
      # post-autoload-dump boots the application and the SPEC 8.1.4 assertion
      # needs origins to exist.
      - name: Provide an environment file before anything boots the app
        run: cp .env.example .env

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrate and check column coverage
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: docup_test
        run: |
          php artisan key:generate
          php artisan migrate --force
          php artisan docup:classify --check

  # §15.6: contribution is under the DCO, so every commit carries a sign-off.
  # Checked on EVERY commit in the pull request rather than only the tip,
  # because a rebase or a squash later turns an unsigned middle commit into an
  # unsigned commit on main, and by then the contributor has moved on and
  # cannot be asked to re-attest.
  #
  # Merge commits are exempt: they are created by the forge, not attested to by
  # a person.
  dco:
    name: every commit is signed off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check sign-off on each commit
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Trailers are read with git's own parser rather than a grep over the
          # message. The first version of this check used
          # `grep -iF "Signed-off-by: $author"`, which reported a FAILURE on a
          # correctly signed commit and aborted outright on one shell - an
          # interpolated fixed-string pattern is the wrong tool for comparing
          # two identities. git knows what a trailer is; grep does not.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          failed=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly=true)' "$sha")"

            if [ -z "${trailers//[[:space:]]/}" ]; then
              echo "::error::missing Signed-off-by: $sha ($subject)"
              echo "          fix with: git rebase --signoff ${base}"
              failed=1
              continue
            fi

            # The sign-off must match the commit author. A sign-off in someone
            # else's name is not an attestation, and it is the one failure mode
            # that a check for the header alone waves through.
            want="$(lower "$author")"
            matched=0
            while IFS= read -r value; do
              [ -n "$value" ] || continue
              if [ "$(lower "$value")" = "$want" ]; then
                matched=1
              fi
            done <<< "$trailers"

            if [ "$matched" -eq 0 ]; then
              echo "::error::sign-off does not match the author of $sha ($subject)"
              echo "          author:    $author"
              echo "          signed by: $trailers"
              failed=1
            fi
          done <<< "$(git rev-list --no-merges "${base}..${head}")"

          if [ "$failed" -eq 0 ]; then
            echo "all commits signed off (DCO, §15.6)"
          fi
          exit "$failed"

  # ---------------------------------------------------------------------------
  # ADR 0001 / SPEC 11.3: "nginx + php-fpm is an equal alternative … behind one
  # ArtifactHandoff interface, implemented from day one and run as a CI matrix
  # leg, not merely documented."
  #
  # 🛑 This is the dynamic half of SPEC 18.18, and the static test cannot replace
  # it. tests/Feature/Serving/HandoffHeaderParityTest.php proves the application
  # SETS every preserved header and that deploy/nginx.conf NAMES every one of
  # them; it cannot prove a running nginx EMITS them. SPEC 18.18's failure mode
  # is "silent security degradation, not a visible error" — a private document
  # served with no `private, no-store` behind a correct-looking 200 — because
  # nginx replaces the entire response header set on an internal redirect. A
  # configuration that fails to apply looks exactly like one that works.
  #
  # Both drivers run the SAME script against the SAME assertions. That is the
  # point: a driver-specific test would let the two diverge and call it passing.
  edge:
    name: edge driver (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Both legs always report. SPEC 18.18 is about a difference between the
      # drivers, and a cancelled sibling hides exactly the comparison wanted.
      fail-fast: false
      matrix:
        include:
          - driver: caddy-intercept
            compose: compose.yaml
            base: http://localhost:8080
            # FrankenPHP IS the edge, so there is no separate service to start,
            # and `runner` is Phase 06's build sandbox with no part in this.
            services: db cache app
          - driver: nginx-accel
            compose: compose.nginx.yaml
            base: http://localhost:8090
            services: db cache app edge

    steps:
      - uses: actions/checkout@v5

      - name: Compose an environment
        run: |
          set -euo pipefail
          cp .env.example .env

          # Written directly rather than with `artisan key:generate`, which
          # needs a bootable application and the application needs the key.
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> .env
          printf 'APP_ENV=local\n' >> .env

          # 🛑 SPEC 8.22.1 refuses to start without this, and the fixture script
          # mints an API token, which writes an audit entry. .env.example ships it
          # EMPTY on purpose -- a committed default audit key is a key an attacker
          # also has, and whoever holds it can forge a chain that verifies -- so
          # every environment has to generate its own. A throwaway one is correct
          # here: the run is destroyed with the runner, and nothing verifies a
          # chain across runs.
          printf 'DOCUP_AUDIT_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'DOCUP_EDGE_DRIVER=%s\n' '${{ matrix.driver }}' >> .env

          # The hosts the script sends as `Host:`. They never resolve and do not
          # need to: every request goes to localhost with an explicit header,
          # which is also what SPEC 8.9.4 says a project must be resolved from.
          printf 'DOCUP_APP_HOST=docup.localhost\n' >> .env
          printf 'DOCUP_DOCS_APEX=docup-docs.localhost\n' >> .env
          printf 'DOCUP_PREVIEW_APEX=docup-previews.localhost\n' >> .env
          printf 'DOCUP_ASSET_HOST=assets.docup-docs.localhost\n' >> .env

      - name: Build the image
        run: docker compose -f '${{ matrix.compose }}' build app

      # 🛑 `-e COMPOSER_AUTH` because this one runs INSIDE the container, and
      # `docker compose run` passes no host environment through on its own. The
      # workflow-level variable would be silently absent here, which is the
      # shape of fix that looks applied and is not — this job is where the
      # zipball timeouts actually hit.
      #
      # A runtime environment variable, never a build argument: it must not
      # reach an image layer.
      - name: Install dependencies
        run: |
          docker compose -f '${{ matrix.compose }}' run --rm --no-deps \
            -e COMPOSER_AUTH -e COMPOSER_MAX_PARALLEL_HTTP app \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Start the stack
        run: |
          docker compose -f '${{ matrix.compose }}' up -d ${{ matrix.services }}

      - name: Migrate
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f '${{ matrix.compose }}' exec -T app \
                 php artisan migrate --force --no-interaction; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::migrations never succeeded"
          exit 1

      # 🛑 SPEC 8.22.1, applied where it can actually take effect.
      #
      # The compose stack mounts these scripts for first initialisation, which
      # happens against an EMPTY schema — so every statement naming a migrated
      # table fails there and the entrypoint wrapper only keeps the container
      # alive. This is the run that hardens the log, and it mirrors the
      # baseline gate's own "Harden the audit log" step for the same reason:
      # the script an operator applies is the script CI applies.
      - name: Harden the audit log
        run: |
          set -euo pipefail
          docker compose -f '${{ matrix.compose }}' exec -T \
            -e MYSQL_PWD=docup-root db \
            sh -c 'mysql -u root docup' < deploy/mysql/init/10-audit-append-only.sql

      - name: Wait for the edge to answer
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Host: docup-docs.localhost' '${{ matrix.base }}/' || echo 000)"

            # 404 is a PASS here: an apex with no project mounted is SPEC 8.9.3's
            # hard 404, which proves PHP answered. 000 is no listener and 502 is
            # nginx without php-fpm behind it, which are the two real failures.
            case "$code" in
              000|502|503|504) sleep 3 ;;
              *) echo "edge answered ${code}"; exit 0 ;;
            esac
          done
          echo "::error::the edge never answered"
          exit 1

      - name: Verify the handoff through the real edge (SPEC 18.18)
        run: |
          SEED_CMD='docker compose -f ${{ matrix.compose }} exec -T app php deploy/seed-edge-fixture.php' \
            bash deploy/verify-edge.sh \
              '${{ matrix.base }}' docup-docs.localhost '${{ matrix.driver }}'

      # 🛑 SPEC 8.12.22's containment self-test, as the shipped script rather
      # than as a step written here. The requirement asks for "a boot-time
      # **and** CI check", so the two must be the same check — a CI-only
      # version would be one an operator cannot run and one nobody notices
      # drifting from what boots.
      #
      # It probes whatever private project the database holds, which after
      # verify-edge.sh is the fixture's. `DOCUP_CONTAINMENT_BASE` points it at
      # the edge's real address while the Host header comes from the plan,
      # because SPEC 8.9.4 resolves a project from the host and nothing else.
      - name: Private-asset containment self-test (SPEC 8.12.22)
        run: |
          DOCUP_CONTAINMENT_BASE='${{ matrix.base }}' \
          ARTISAN='docker compose -f ${{ matrix.compose }} exec -T app php artisan' \
            sh deploy/containment-self-test.sh

      - name: Logs, on failure
        if: failure()
        run: docker compose -f '${{ matrix.compose }}' logs --tail 200

  # 🛑 Phase 07 stands the build sandbox up IN CI, which is what Phase 06's
  # build log recorded as owed: "The end-to-end criterion is demonstrated
  # locally, not in CI … A skip is not a pass."
  #
  # Everything the container tests need is built here — the four images, the
  # §11.2 sandboxes network, the §8.5.9 proxy, a workspace root and a runner
  # consuming the spool — and `DOCUP_E2E=1` turns every skip in those files
  # into a failure. If the sandbox is not standing, this job goes red rather
  # than quietly reporting a green run that exercised nothing.
  sandbox:
    name: build sandbox and its exit criteria
    runs-on: ubuntu-latest
    # 🛑 Raised from 30 in Phase 09. Four of the seven toolchain presets
    # install their dependencies from the §8.5.9 allowlist while the build
    # runs — that is what the npm entry on the allowlist is for — and an
    # `npm install` of a real Docusaurus tree is a minute on its own.
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: docup-root
          MYSQL_DATABASE: docup_test
          MYSQL_USER: docup
          MYSQL_PASSWORD: docup
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdocup-root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: docup_test
      DOCUP_WORKSPACE_ROOT: /var/lib/docup/workspaces
      DOCUP_RUNNER_SPOOL: /var/lib/docup/spool
      DOCUP_SANDBOX_NETWORK: docup_sandboxes
      DOCUP_BUILD_ISOLATION: runc
      DOCUP_SANDBOX_EGRESS: allowlist
      # 🛑 §8.5.15's cgroup reading, at the path it has HERE. The compose
      # runner mounts the hierarchy at /hostcg because it is a container;
      # this job's PHP is the host process, so the real path is the one to
      # use. Without it the sampler finds nothing, `pids.events:max` is
      # never read, and a fork bomb reports success — which is exactly how
      # this job first went red.
      DOCUP_CGROUP_ROOT: /sys/fs/cgroup

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, gd, bcmath, sodium, pcntl, curl
          coverage: none
          tools: composer:v2
          ini-values: upload_max_filesize=1G, post_max_size=1G, memory_limit=512M

      - name: Provide an environment file before anything boots the app
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: |
          php artisan key:generate
          php artisan migrate --force

      # The four images the sandbox is made of. Built rather than pulled:
      # none of them is published yet, and §8.5.14 would want the digest
      # pinned if they were.
      - name: Build the sandbox images
        run: |
          set -euo pipefail
          docker build -q -t docup/fetch:1        -f deploy/Dockerfile.fetch  .
          docker build -q -t docup/build-mkdocs:1 -f deploy/Dockerfile.mkdocs .
          docker build -q -t docup/warden:1       -f deploy/Dockerfile.warden .
          docker build -q -t docup/egress-proxy:1 -f deploy/Dockerfile.proxy  .

          # Phase 09's three toolchain images. 🛑 Four images for seven
          # presets: the division that matters is the language runtime, not
          # the generator (see config/builds.php). Together they are what
          # makes §17's "each of six generators builds from ≤12 lines of
          # configuration" a thing this job demonstrates rather than claims.
          docker build -q -t docup/build-sphinx:1 -f deploy/Dockerfile.sphinx .
          docker build -q -t docup/build-node:1   -f deploy/Dockerfile.node   .
          docker build -q -t docup/build-mdbook:1 -f deploy/Dockerfile.mdbook .

          docker pull -q busybox:stable

      # 🛑 §8.5.14: "the default image — which carries a LaTeX distribution
      # for PDF output — MUST stay under a stated compressed-size ceiling,
      # declared in the image's own documentation and asserted in CI."
      #
      # The declaration is in deploy/Dockerfile.sphinx; this is the
      # assertion. Measured the way a registry stores it — per-image gzip at
      # the default level — rather than by `docker images`, which reports the
      # uncompressed size and would make the ceiling mean something else.
      #
      # A failure here is not "make the number bigger". The number is what
      # every Sphinx build pulls, including the ones that only wanted HTML,
      # and raising it is a §9.4 gate change with the same rules as any
      # other: propose the amendment, do not route around it.
      - name: The Sphinx image is within its stated size ceiling
        run: |
          set -euo pipefail
          ceiling=$((400 * 1024 * 1024))
          actual=$(docker save docup/build-sphinx:1 | gzip -6 | wc -c)

          printf 'sphinx image: %s bytes compressed (%s MiB), ceiling %s MiB\n' \
            "$actual" "$((actual / 1048576))" "$((ceiling / 1048576))"

          if [ "$actual" -gt "$ceiling" ]; then
            echo "::error::SPEC 8.5.14: the Sphinx image is $((actual / 1048576)) MiB compressed, over its stated $((ceiling / 1048576)) MiB ceiling"
            exit 1
          fi

      # 🛑 The §11.2 topology, by hand rather than by compose: this job runs
      # PHP on the runner itself, so the "app zone" is the GitHub runner and
      # only the sandbox half needs building. `--internal` is the same flag
      # compose.yaml sets, and the proxy is the only thing bridging it to a
      # routed network — exactly as in the shipped file.
      - name: Stand up the sandbox network and the egress proxy
        run: |
          set -euo pipefail
          docker network create --internal docup_sandboxes
          docker run -d --name docup-proxy \
            --label docup.role=egress-proxy \
            --network docup_sandboxes \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /var/run/squid:rw,uid=31,gid=31,mode=0700 \
            --tmpfs /var/log/squid:rw,uid=31,gid=31,mode=0700 \
            --tmpfs /var/cache/squid:rw,uid=31,gid=31,mode=0700 \
            docup/egress-proxy:1
          docker network connect bridge docup-proxy

          for _ in $(seq 1 30); do
            if docker exec docup-proxy docup-proxy-healthcheck >/dev/null 2>&1; then
              echo "proxy is refusing non-allowlisted hosts"; exit 0
            fi
            sleep 2
          done
          echo "::error::the egress proxy never came up"
          docker logs docup-proxy
          exit 1

      # 🛑 Root, and the reason is the same one the runner service has:
      # every container in the pipeline runs as uid 10001 (§8.5.8) and the
      # workspace has to be owned by it. On this runner PHP is the host
      # process, so `chown` needs root rather than a container doing it.
      - name: Create the spool and the workspace root
        run: |
          sudo mkdir -p /var/lib/docup/workspaces /var/lib/docup/spool
          sudo chmod 0755 /var/lib/docup /var/lib/docup/workspaces /var/lib/docup/spool

      # §8.5.12's self-test runs here, as part of starting the runner. A
      # non-zero exit means the sandbox failed its isolation check and the
      # job stops — which is the behaviour an operator gets from compose.
      - name: Start the runner, which runs the §8.5.12 self-test
        run: |
          set -euo pipefail

          # The environment, named explicitly. The pest step below says why.
          sudo env "PATH=$PATH" \
            "DB_HOST=${DB_HOST}" \
            "DB_DATABASE=${DB_DATABASE}" \
            "DOCUP_WORKSPACE_ROOT=${DOCUP_WORKSPACE_ROOT}" \
            "DOCUP_RUNNER_SPOOL=${DOCUP_RUNNER_SPOOL}" \
            "DOCUP_SANDBOX_NETWORK=${DOCUP_SANDBOX_NETWORK}" \
            "DOCUP_BUILD_ISOLATION=${DOCUP_BUILD_ISOLATION}" \
            "DOCUP_SANDBOX_EGRESS=${DOCUP_SANDBOX_EGRESS}" \
            "DOCUP_CGROUP_ROOT=${DOCUP_CGROUP_ROOT}" \
            php artisan docup:runner --once
          test -f /var/lib/docup/spool/self-test.json
          cat /var/lib/docup/spool/self-test.json
          grep -q '"passed":true' /var/lib/docup/spool/self-test.json

      - name: Run the runner in the background for the end-to-end build
        run: |
          # The log file is created by THIS user and the redirect is this
          # shell's, deliberately: a root-owned log in /tmp would not be
          # readable by the wait below or by the failure step at the end.
          : > /tmp/runner.log
          # shellcheck disable=SC2024
          # The environment, named explicitly. The pest step below says why.
          sudo env "PATH=$PATH" \
            "DB_HOST=${DB_HOST}" \
            "DB_DATABASE=${DB_DATABASE}" \
            "DOCUP_WORKSPACE_ROOT=${DOCUP_WORKSPACE_ROOT}" \
            "DOCUP_RUNNER_SPOOL=${DOCUP_RUNNER_SPOOL}" \
            "DOCUP_SANDBOX_NETWORK=${DOCUP_SANDBOX_NETWORK}" \
            "DOCUP_BUILD_ISOLATION=${DOCUP_BUILD_ISOLATION}" \
            "DOCUP_SANDBOX_EGRESS=${DOCUP_SANDBOX_EGRESS}" \
            "DOCUP_CGROUP_ROOT=${DOCUP_CGROUP_ROOT}" \
            php artisan docup:runner >> /tmp/runner.log 2>&1 &
          for _ in $(seq 1 20); do
            if grep -q 'runner ready' /tmp/runner.log; then exit 0; fi
            sleep 1
          done
          echo "::error::the runner never became ready"
          cat /tmp/runner.log
          exit 1

      # 🛑 DOCUP_E2E=1 turns a skip into a failure. Without it this job
      # could report green having exercised nothing at all, which is the
      # exact state Phase 06 shipped in and recorded as owed.
      - name: Phase 07 and Phase 09 exit criteria, and the end-to-end build
        env:
          DOCUP_E2E: '1'
          NO_COLOR: '1'
        run: |
          set -o pipefail

          # 🛑 This job's `env:` does not survive `sudo`, so every root
          # step names what it needs.
          #
          # `sudo -E` is not the answer and was the original mistake: the
          # runner's sudoers grants NOPASSWD without SETENV, so `-E` is
          # REFUSED with a warning and the environment is reset anyway. It
          # reads as though it preserves the environment, which is exactly
          # how this went unnoticed. `env VAR=value` passes arguments to a
          # command instead of asking sudo for a policy exemption, so it
          # works where `-E` does not.
          #
          # Two of these were load-bearing and both were silent:
          #
          #   DB_HOST            phpunit.xml supplies `db` when nothing else
          #                      has -- its <env> elements fill a GAP rather
          #                      than override, so stripping the variable is
          #                      what activates the compose hostname. 60 of
          #                      these tests failed on `getaddrinfo for db`.
          #   DOCUP_CGROUP_ROOT  config/builds.php defaults it to /hostcg,
          #                      the path the runner CONTAINER mounts. Here
          #                      PHP is the host process, so the sampler
          #                      found no hierarchy, read no counters, and a
          #                      fork bomb reported SUCCESS (§8.5.15).
          #
          # The rest are passed because the next variable to be added will
          # be load-bearing too, and a list that is complete cannot be
          # incomplete by omission. They are echoed below so a red log
          # shows the environment rather than inviting an inference.
          php -r 'printf("%s: DB_HOST=%s DOCUP_CGROUP_ROOT=%s".PHP_EOL, $argv[1], getenv("DB_HOST") ?: "(unset)", getenv("DOCUP_CGROUP_ROOT") ?: "(unset)");' -- 'before sudo'
          sudo env "PATH=$PATH" "DB_HOST=${DB_HOST}" "DOCUP_CGROUP_ROOT=${DOCUP_CGROUP_ROOT}" \
            php -r 'printf("%s: DB_HOST=%s DOCUP_CGROUP_ROOT=%s".PHP_EOL, $argv[1], getenv("DB_HOST") ?: "(unset)", getenv("DOCUP_CGROUP_ROOT") ?: "(unset)");' -- ' after sudo'

          sudo env "PATH=$PATH" \
            "DB_HOST=${DB_HOST}" \
            "DB_DATABASE=${DB_DATABASE}" \
            "DOCUP_WORKSPACE_ROOT=${DOCUP_WORKSPACE_ROOT}" \
            "DOCUP_RUNNER_SPOOL=${DOCUP_RUNNER_SPOOL}" \
            "DOCUP_SANDBOX_NETWORK=${DOCUP_SANDBOX_NETWORK}" \
            "DOCUP_BUILD_ISOLATION=${DOCUP_BUILD_ISOLATION}" \
            "DOCUP_SANDBOX_EGRESS=${DOCUP_SANDBOX_EGRESS}" \
            "DOCUP_CGROUP_ROOT=${DOCUP_CGROUP_ROOT}" \
            ./vendor/bin/pest \
            tests/Feature/Builds \
            --colors=never 2>&1 | tee /tmp/sandbox.log

      - name: Runner log, on failure
        if: failure()
        run: |
          tail -200 /tmp/runner.log || true
          docker logs --tail 100 docup-proxy || true
          docker ps -a --filter label=docup.owner=build-runner || true

  # ---------------------------------------------------------------------------
  # 🛑 SPEC 17 Phase 24's exit criterion, against a REAL Keycloak.
  # ---------------------------------------------------------------------------
  # 🛑 SPEC 9.4's mutation score, which this repository has owed since Phase 04.
  #
  # > "**Security-critical phases:** additionally a mutation score ≥75% on
  # > changed domain code"
  #
  # The build log carried it as "needs Infection, which is not installed" for
  # eight phases. That reason went out of date: the project is on
  # `pestphp/pest ^5`, and Pest 5 has mutation testing built in. The threshold
  # has been committed in `config/docup.php` the whole time, and the
  # `thresholds` job already fails when it decreases -- so the configuration,
  # the check and the tool were all present and only the step was missing.
  #
  # 🛑 Its own job, and for a reason the other integration jobs share: it needs
  # `coverage: pcov`, which the baseline gate deliberately sets to `none`
  # because coverage instrumentation slows every test in the suite. A failure
  # here should also name the gate rather than the suite.
  #
  # 🛑 The class list is DELIBERATELY SHORT and is meant to grow. A first step
  # that covered every namespace would either take an hour or go red on code
  # nobody is changing, and neither teaches a phase anything. It starts with
  # the one class Phase 26b added that is pure decision logic over untrusted
  # input -- the CIDR matcher behind an API token's address binding, whose
  # wrong answer is either an admitted stranger or a locked-out operator.
  # A later phase adds its own classes beside it; the threshold is shared.
  # ---------------------------------------------------------------------------
  mutation:
    name: mutation score on changed domain code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: docup-root
          MYSQL_DATABASE: docup_test
          MYSQL_USER: docup
          MYSQL_PASSWORD: docup
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdocup-root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: docup_test
      NO_COLOR: '1'

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, gd, bcmath, sodium, pcntl, redis, ldap
          # 🛑 The one job that wants it. Mutation testing cannot map a mutation
          # to a covering test without coverage data, and Pest reports every
          # mutation as `UNCOVERED` rather than failing when it is absent --
          # which would be a gate that passed while measuring nothing.
          coverage: pcov

      - name: Provide an environment file before anything boots the app
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: |
          set -euo pipefail
          php artisan key:generate
          php artisan migrate --force --no-interaction

      # 🛑 `--min` comes from the committed threshold rather than being written
      # here, so the `thresholds` job's "a threshold must not decrease" check
      # governs this gate too. A number in the workflow would be a second copy
      # that could drift below the first.
      #
      # 🛑 AND THERE IS NO `--coverage` HERE, DELIBERATELY. It belongs on a
      # coverage run and looks like it belongs on this one, so the next person
      # to read this will add it; the first version of this job did. Pest
      # registers `Pest\Mutate\Plugins\Mutate` BEFORE `Pest\Plugins\Coverage`
      # and `MinScoreOption::remove()` returns false -- so the mutation plugin
      # reads `--min` and then LEAVES IT in the argument list, where the
      # coverage plugin pops it as a *coverage* threshold. With `--coverage`
      # present that plugin then goes looking for a report the mutation run
      # never writes and the step dies on
      # `Coverage not found in path: vendor/pestphp/pest/.temp/coverage.php`
      # AFTER printing a passing score. Mutation testing needs the coverage
      # DRIVER, which `coverage: pcov` above provides; it does not need the
      # flag, and the plugin appends its own `--coverage-php` when the flag is
      # absent.
      - name: SPEC 9.4's mutation score
        run: |
          set -o pipefail

          min="$(
            php -r 'require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              echo (int) config("docup.gates.security_critical.mutation_min_score");'
          )"

          if [ -z "$min" ] || [ "$min" -lt 1 ]; then
            echo "::error::could not read docup.gates.security_critical.mutation_min_score"
            exit 1
          fi

          echo "minimum mutation score: ${min}%"

          # 🛑 ONE `--class` WITH A COMMA-SEPARATED LIST, not two flags.
          #
          # Pest's `--class` does NOT accumulate: a second occurrence REPLACES
          # the first, silently. Measured while adding Phase 27's target —
          # `--class='App\Auth\CidrRange' --class='App\Branding\ContrastGate'`
          # reported 70 mutations, exactly ContrastGate's own count, so the
          # CidrRange half of this gate would have stopped being measured while
          # the job carried on passing. The comma form reports 175.
          #
          # 🛑 Each phase that is security-critical under SPEC 9.4 adds its
          # own class and its covering tests here. Phase 27's is
          # `App\Branding\ContrastGate`: SPEC 8.14.5's refusal below 3:1 is the
          # control the whole phase turns on, it is pure arithmetic, and a
          # surviving mutation in it is a theme shipped below the floor with a
          # passing report. Measured at 81.4% on its own and 82.9% with
          # CidrRange.
          ./vendor/bin/pest \
            --mutate \
            --covered-only \
            --min="$min" \
            --class='App\Auth\CidrRange,App\Branding\ContrastGate' \
            tests/Feature/InvitationAndTokenTest.php \
            tests/Feature/Providers/ProviderCorpusTest.php \
            tests/Unit/Branding \
            --colors=never 2>&1 | tee /tmp/mutation.log

      - name: The score, on failure
        if: failure()
        run: tail -120 /tmp/mutation.log || true

  # ---------------------------------------------------------------------------
  # 🛑 SPEC 17's Phase 26b exit criterion 1, against a REAL directory.
  #
  # > "An LDAP group removal drops access on the next decision."
  #
  # `tests/Feature/Ldap/LdapBoundaryTest.php` proves everything that is DocUp's
  # with no server at all — filter escaping against a hostile username, the TLS
  # and referral options, the installation-scope narrowing, the sorting of
  # operator faults from reader faults. What it cannot prove is that DocUp
  # speaks the protocol a real directory speaks: that StartTLS verifies with
  # `LDAP_OPT_X_TLS_HARD` set, that a simple bind as the reader's own DN is what
  # checks their password, that `memberOf` arrives as a list, and that removing
  # a member from a group changes what the next bind sees.
  #
  # 🛑 **And without this job the integration would SKIP.**
  # `LdapDirectoryTest` gates on `DOCUP_LDAP_E2E`, so on a runner with no
  # directory it skips — and Phase 06's recorded lesson is that "a skip is not a
  # pass". Phase 07 put the build sandbox in CI for exactly that reason; this is
  # the same move, one phase later, for a driver that shipped in Phase 23 with
  # no sign-in path at all.
  #
  # Its own job rather than a step in `baseline gate`, like the OIDC, TLS and
  # edge jobs: it needs a service the shipped compose file does not start, and a
  # failure here should name the integration rather than the suite.
  # ---------------------------------------------------------------------------
  ldap:
    name: LDAP against a real OpenLDAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Compose an environment
        run: |
          set -euo pipefail
          cp .env.example .env
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> .env
          printf 'APP_ENV=local\n' >> .env
          printf 'DOCUP_AUDIT_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'DOCUP_APP_HOST=docup.localhost\n' >> .env
          printf 'DOCUP_DOCS_APEX=docup-docs.localhost\n' >> .env
          printf 'DOCUP_PREVIEW_APEX=docup-previews.localhost\n' >> .env
          printf 'DOCUP_ASSET_HOST=assets.docup-docs.localhost\n' >> .env

      # 🛑 BEFORE the stack comes up. The certificate is a bind mount and the
      # entrypoint refuses to start without it — slapd reads
      # `olcTLSCertificateFile` at start-up, so writing it later would leave the
      # first handshake unprotected.
      - name: Generate the directory's certificate
        run: bash deploy/ldap-test-setup.sh

      - name: Build the images
        run: docker compose -f compose.yaml -f compose.ldap.yaml build app openldap

      - name: Install dependencies
        run: |
          docker compose -f compose.yaml -f compose.ldap.yaml run --rm --no-deps app \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Start the stack and the directory
        run: docker compose -f compose.yaml -f compose.ldap.yaml up -d db cache openldap app

      # The same reasoning the OIDC job gives: compose.ldap.yaml points the
      # application at `docup_test` so the suite and the running application
      # share one database, and the image grants the `docup` user only `docup`.
      - name: Create the shared test database
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.ldap.yaml exec -T -e MYSQL_PWD=docup-root db \
                 mysql -u root -e "CREATE DATABASE IF NOT EXISTS \`docup_test\`
                                     DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
                                   GRANT ALL PRIVILEGES ON \`docup_test\`.* TO 'docup'@'%';
                                   FLUSH PRIVILEGES;"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not create docup_test"
          exit 1

      - name: Migrate
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.ldap.yaml exec -T -e DB_DATABASE=docup_test app \
                 php artisan migrate --force --no-interaction; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::migrations never succeeded"
          exit 1

      # 🛑 Waits for the healthcheck, which is a real search over StartTLS and
      # not a port probe — the entrypoint builds the directory BEFORE slapd
      # starts, so an open port would go green while the tree was still absent
      # and the first run on a cold runner would be the flaky one.
      - name: Wait for the directory
        run: |
          set -euo pipefail
          id="$(docker compose -f compose.yaml -f compose.ldap.yaml ps -q openldap)"
          for _ in $(seq 1 40); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$id" 2>/dev/null || echo starting)"
            if [ "$state" = healthy ]; then
              echo 'the directory is up'
              exit 0
            fi
            sleep 3
          done
          echo "::error::the directory never became healthy"
          docker compose -f compose.yaml -f compose.ldap.yaml logs openldap --tail 60
          exit 1

      # 🛑 Through DocUp's own connection class, with every SPEC 8.12.18 option
      # in force. The script's `--trust` leg both installs the anchor and PROVES
      # `LdapConnection` can verify the directory — so a trust-store problem
      # fails here, before any reader is involved, with a reason. A curl would
      # verify a different store.
      - name: Trust the directory's certificate in the app container
        run: |
          DOCUP_COMPOSE="docker compose -f compose.yaml -f compose.ldap.yaml" \
            bash deploy/ldap-test-setup.sh --trust

      # 🛑 DOCUP_LDAP_E2E=1 turns a skip into a failure, which is the whole
      # reason this job exists.
      - name: SPEC 17's Phase 26b exit criterion 1, end to end
        run: |
          set -o pipefail
          docker compose -f compose.yaml -f compose.ldap.yaml exec -T \
            -e DB_DATABASE=docup_test -e DOCUP_LDAP_E2E=1 -e NO_COLOR=1 app \
            ./vendor/bin/pest tests/Feature/Ldap --colors=never

      - name: Logs, on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ldap.yaml logs --tail 200

  # ---------------------------------------------------------------------------
  #
  # > "Two projects on one installation authenticate readers against two
  # > different Keycloak realms in one browser session."
  #
  # `tests/Feature/Oidc` drives the same flow against a stubbed transport and
  # proves everything that is DocUp's. What it cannot prove is that a real
  # provider agrees — the discovery document's actual shape, Keycloak's own
  # `at_hash`, the token endpoint's error bodies, and group claims as Keycloak
  # releases them. A fixture agrees with whatever DocUp believes.
  #
  # Its own job rather than a step in `baseline gate`, for the reason the TLS
  # and edge jobs are separate: it needs a service the shipped compose file does
  # not start, and a failure here should name the integration rather than the
  # suite.
  oidc:
    name: OIDC against a real Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Compose an environment
        run: |
          set -euo pipefail
          cp .env.example .env
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> .env
          printf 'APP_ENV=local\n' >> .env
          printf 'DOCUP_AUDIT_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'DOCUP_APP_HOST=docup.localhost\n' >> .env
          printf 'DOCUP_DOCS_APEX=docup-docs.localhost\n' >> .env
          printf 'DOCUP_PREVIEW_APEX=docup-previews.localhost\n' >> .env
          printf 'DOCUP_ASSET_HOST=assets.docup-docs.localhost\n' >> .env

      # 🛑 BEFORE the stack comes up. The certificate is a bind mount, so
      # Keycloak needs it to exist at start-up — a container that starts without
      # it fails with a TLS configuration error that names neither.
      - name: Generate Keycloak's certificate
        run: bash deploy/oidc-test-setup.sh

      - name: Build the image
        run: docker compose -f compose.yaml -f compose.oidc.yaml build app

      - name: Install dependencies
        run: |
          docker compose -f compose.yaml -f compose.oidc.yaml run --rm --no-deps app \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Start the stack and Keycloak
        run: docker compose -f compose.yaml -f compose.oidc.yaml up -d db cache keycloak app

      # The same reasoning the TLS job gives: compose.oidc.yaml points the
      # application at `docup_test` so the seeder and the running application
      # share one database, and the image grants the `docup` user only `docup`.
      - name: Create the shared test database
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.oidc.yaml exec -T -e MYSQL_PWD=docup-root db \
                 mysql -u root -e "CREATE DATABASE IF NOT EXISTS \`docup_test\`
                                     DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
                                   GRANT ALL PRIVILEGES ON \`docup_test\`.* TO 'docup'@'%';
                                   FLUSH PRIVILEGES;"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not create docup_test"
          exit 1

      - name: Migrate
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.oidc.yaml exec -T app \
                 php artisan migrate --force --no-interaction; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::migrations never succeeded"
          exit 1

      # 🛑 Waits for the REALM, not for a health endpoint. `--import-realm`
      # finishes after the server starts listening, so a health check that went
      # green first would make the seeder fail intermittently on a cold runner.
      - name: Wait for Keycloak to import both realms
        run: |
          set -euo pipefail
          for realm in acme globex; do
            ok=0
            for _ in $(seq 1 60); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-to "keycloak:8443:127.0.0.1:8444" \
                --cacert deploy/keycloak-tls/keycloak.crt \
                "https://keycloak:8443/realms/${realm}/.well-known/openid-configuration" || echo 000)"
              if [ "$code" = 200 ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "::error::realm ${realm} never answered"
              docker compose -f compose.yaml -f compose.oidc.yaml logs keycloak --tail 60
              exit 1
            fi
            echo "realm ${realm} is up"
          done

      # 🛑 Through the application's own egress client, with verification ON.
      # §8.3.9 is what this proves: the certificate is trusted in the container,
      # and the probe that follows reaches Keycloak the way a reader's login
      # will. A curl from the runner would verify a different trust store.
      - name: Trust Keycloak's certificate in the app container
        run: |
          DOCUP_COMPOSE="docker compose -f compose.yaml -f compose.oidc.yaml" \
            bash deploy/oidc-test-setup.sh --trust

      # Seeds two projects, two bindings and two rules, and PROBES each binding
      # against the live realms — so a configuration that cannot reach Keycloak
      # fails here, before any reader is involved, with a reason.
      - name: Seed two projects against the two realms
        id: seed
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.oidc.yaml exec -T \
            -e DB_DATABASE=docup_test -e APP_ENV=testing app \
            php deploy/seed-oidc-fixture.php | tee /tmp/oidc-hosts.env
          grep -q DOCUP_OIDC_HOST_ACME /tmp/oidc-hosts.env

      - name: Two realms, one browser session (SPEC 17 Phase 24)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          export $(grep -E '^DOCUP_OIDC_HOST_' /tmp/oidc-hosts.env | xargs)
          bash deploy/verify-oidc.sh

      - name: Logs, on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.oidc.yaml logs --tail 120 app
          docker compose -f compose.yaml -f compose.oidc.yaml logs --tail 60 keycloak

  # 🛑 Phase 19's TLS automation, against a REAL certificate authority and the
  # stack's own proxy.
  #
  # Two of the phase's exit criteria are claims about things nothing but a
  # running system can answer: "an internal ACME directory issues for an
  # air-gapped name", and SPEC 18.17's "the edge consults a database-backed
  # certificate manager at handshake and falls back to on-demand ACME on a
  # negative answer, rather than failing the handshake". A stub would assert
  # what we believe RFC 8555 and Caddy do; Pebble and Caddy assert what they
  # do — and they disagreed with the obvious implementation twice, over a
  # missing User-Agent and over 404 versus 204.
  #
  # DOCUP_E2E=1 (set in compose.tls.yaml) turns every skip in tests/Feature/Tls
  # into a failure, so this job cannot go green having exercised nothing.
  tls:
    name: TLS automation and certificate sources
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Compose an environment
        run: |
          set -euo pipefail
          cp .env.example .env
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32)" >> .env
          printf 'APP_ENV=local\n' >> .env
          printf 'DOCUP_AUDIT_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'DOCUP_APP_HOST=docup.localhost\n' >> .env
          printf 'DOCUP_DOCS_APEX=docup-docs.localhost\n' >> .env
          printf 'DOCUP_PREVIEW_APEX=docup-previews.localhost\n' >> .env
          printf 'DOCUP_ASSET_HOST=assets.docup-docs.localhost\n' >> .env

      - name: Build the image
        run: docker compose -f compose.yaml -f compose.tls.yaml build app

      - name: Install dependencies
        run: |
          docker compose -f compose.yaml -f compose.tls.yaml run --rm --no-deps app \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Start the stack and the certificate authority
        run: docker compose -f compose.yaml -f compose.tls.yaml up -d db cache pebble app

      # 🛑 compose.tls.yaml points the application at `docup_test` so the suite
      # and the running application share one database — EdgeHandshakeTest
      # drives a real handshake, and the rows it writes must be visible to the
      # FPM worker that answers the proxy's calls.
      #
      # The image creates `docup` and grants the `docup` user that one
      # database, so `docup_test` has to be created and granted here. It
      # worked locally only because the development database already had it
      # from an earlier phase, which is exactly the kind of difference between
      # a laptop and a clean runner that CI exists to find.
      - name: Create the shared test database
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.tls.yaml exec -T -e MYSQL_PWD=docup-root db \
                 mysql -u root -e "CREATE DATABASE IF NOT EXISTS \`docup_test\`
                                     DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
                                   GRANT ALL PRIVILEGES ON \`docup_test\`.* TO 'docup'@'%';
                                   FLUSH PRIVILEGES;"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not create docup_test"
          exit 1

      - name: Migrate
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker compose -f compose.yaml -f compose.tls.yaml exec -T app \
                 php artisan migrate --force --no-interaction; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::migrations never succeeded"
          exit 1

      # 🛑 SPEC 8.22.1's triggers, applied where they can take effect — the
      # same step the baseline and edge jobs run, for the same reason: the
      # compose init scripts run against an empty schema.
      - name: Harden the audit log
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.tls.yaml exec -T \
            -e MYSQL_PWD=docup-root db \
            sh -c 'mysql -u root docup_test' < deploy/mysql/init/10-audit-append-only.sql

      # 🛑 SPEC 8.10.11 gates issuance on the hostname "currently resolving in
      # live DNS to an advertised ingress target". Inside a compose network the
      # app's own address is that target, and it is discovered rather than
      # guessed: SPEC 8.10.8 says DocUp cannot discover its own public address,
      # and this is the one place where the test harness legitimately can.
      - name: Advertise the ingress address and restart on it
        run: |
          set -euo pipefail
          APP_IP="$(docker compose -f compose.yaml -f compose.tls.yaml exec -T app \
            sh -c "getent hosts docup-acme.test | awk '{print \$1}'" | tr -d '\r')"
          echo "app address: ${APP_IP}"
          test -n "${APP_IP}"
          echo "DOCUP_INGRESS_ADDRESSES=${APP_IP}" >> "$GITHUB_ENV"
          DOCUP_INGRESS_ADDRESSES="${APP_IP}" \
            docker compose -f compose.yaml -f compose.tls.yaml up -d app

      - name: Trust the test certificate authority
        run: bash deploy/tls-test-setup.sh

      # 🛑 After the CA is installed, because Caddy reads the system trust
      # store at start: without this the proxy cannot speak to Pebble and
      # SPEC 18.17's fallback cannot be measured.
      - name: Restart the edge so it trusts the CA
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.tls.yaml restart app
          for _ in $(seq 1 60); do
            code="$(docker compose -f compose.yaml -f compose.tls.yaml exec -T app \
              curl -s -o /dev/null -w '%{http_code}' http://localhost/_/health || echo 000)"
            if [ "$code" = "200" ]; then echo "edge answered"; exit 0; fi
            sleep 2
          done
          echo "::error::the edge never answered"
          exit 1

      - name: Phase 19 exit criteria
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          docker compose -f compose.yaml -f compose.tls.yaml exec -T -e DOCUP_E2E=1 -e NO_COLOR=1 app \
            ./vendor/bin/pest tests/Feature/Tls tests/Unit/Tls --colors=never 2>&1 | tee /tmp/tls.log

      - name: Logs, on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.tls.yaml logs --tail 200 app || true
          docker compose -f compose.yaml -f compose.tls.yaml logs --tail 100 pebble || true
