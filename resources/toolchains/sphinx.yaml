# SPDX-FileCopyrightText: 2026 The DocUp contributors
# SPDX-License-Identifier: Apache-2.0
#
# SPEC 11.4's DocToolAdapter, as data. See app/Builds/Toolchain/ToolchainPreset.php
# for the contract; the variables below are exported by the pipeline and are
# the ONLY way a repository-supplied value reaches a command.

key: sphinx
name: Sphinx
image: sphinx

detect:
  - conf.py
  - docs/conf.py
  - source/conf.py

configuration:
  key: sphinx
  required: true
  candidates:
    - conf.py
    - docs/conf.py
    - source/conf.py

# SPEC 8.4.2's `sphinx.fail_on_warning`. `--keep-going` is paired with it
# deliberately: without it Sphinx stops at the first warning, so an author
# fixing a hundred of them fixes them one build at a time.
strict_flag: "-W --keep-going"

environment:
  LANG: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"

  # SPEC 18.13: the fragment cache only pays if two identical builds produce
  # identical output. Sphinx stamps `html_last_updated_fmt` into every page
  # footer from the file mtime unless this is set, and a shallow clone gives
  # every file the clone's own timestamp - so without this, two builds of the
  # same commit minutes apart differ on every page.
  SOURCE_DATE_EPOCH: "315532800"

steps:
  create_environment: []
  install: []

formats:
  html:
    - >-
      sphinx-build -b "$DOCUP_BUILDER" $DOCUP_STRICT
      -d "$DOCUP_WORK_DIR/doctrees"
      "$DOCUP_CONFIGURATION_DIR" "$DOCUP_OUTPUT/html"

    # 🛑 SPEC 8.7.6's nav fragment, from "the generator's own output
    # (... Sphinx `-b json` toctree ...)".
    #
    # 🛑 Read from the root document's `toctree` directives rather than by
    # running a second `-b json` build, and the reason is cost: a JSON build
    # is a whole second pass over every page of the repository, for a tree
    # that is written down in one file. A `toctree` IS the navigation Sphinx
    # renders - the JSON builder's `globaltoc` is derived from these same
    # directives - so this reads the source rather than a projection of it.
    #
    # Both syntaxes, because MyST is in the default image: reStructuredText's
    # `.. toctree::` and MyST's ```{toctree}```. A `:caption:` becomes a
    # section label, which is how a Sphinx author already groups pages.
    #
    # Ends in `|| true` like every nav step: SPEC 8.7.6 degrades a missing
    # fragment to a labelled section, so this must never fail a build.
    - |
      cat > "$DOCUP_WORK_DIR/docup-nav.py" <<'DOCUP_NAV_EOF'
      import json, os, re, sys

      source_dir = sys.argv[1]
      target = sys.argv[2]
      builder = sys.argv[3] if len(sys.argv) > 3 else 'html'

      root = None
      for candidate in ('index.rst', 'index.md', 'index.txt', 'contents.rst'):
          path = os.path.join(source_dir, candidate)
          if os.path.isfile(path):
              root = path
              break

      if root is None:
          sys.exit(0)

      with open(root, encoding='utf-8', errors='replace') as handle:
          lines = handle.read().splitlines()

      DIRECTIVE = re.compile(r'^(\s*)(\.\.\s+toctree::|```+\{toctree\}|:::+\{toctree\})\s*$')
      nodes = []
      index = 0

      while index < len(lines):
          opened = DIRECTIVE.match(lines[index])
          if not opened:
              index += 1
              continue

          indent = len(opened.group(1))
          fence = opened.group(2)[0] if opened.group(2)[0] in '`:' else None
          index += 1
          caption = None
          entries = []

          while index < len(lines):
              line = lines[index]
              stripped = line.strip()
              index += 1

              if fence is not None:
                  # A MyST block ends only at its closing fence, so an entry
                  # at column zero is ordinary rather than a dedent.
                  if stripped and set(stripped) == {fence}:
                      break
              elif stripped and not line.startswith(' ' * (indent + 1)):
                  # reStructuredText ends a directive by dedenting. Step back
                  # so the outer loop sees this line, which may itself open
                  # the next toctree.
                  index -= 1
                  break

              if stripped.startswith(':') and stripped.count(':') >= 2:
                  if stripped.startswith(':caption:'):
                      caption = stripped.split(':caption:', 1)[1].strip()
                  continue

              if stripped:
                  entries.append(stripped)

          children = []
          for entry in entries:
              label, marker, document = entry.rpartition('<')
              if marker:
                  document = document.rstrip('>').strip()
                  label = label.strip()
              else:
                  document = entry.strip()
                  label = document.rsplit('/', 1)[-1].replace('-', ' ').replace('_', ' ').strip()

              if not document or document.startswith(('http://', 'https://', '/')):
                  continue

              # `dirhtml` serves `a/b` as `a/b/`; `html` serves it as
              # `a/b.html`. A fragment that assumed one would link to
              # files the other never wrote.
              # 🛑 `url`, not `target`: `target` is the output path this
              # script writes to, and shadowing it here made the script
              # write the fragment to a file named after the last nav
              # entry — which `|| true` then swallowed, so the only
              # symptom was a Sphinx component with no navigation.
              if builder == 'dirhtml':
                  url = '' if document == 'index' else document + '/'
              else:
                  url = document + '.html'

              children.append({'label': label or document, 'href': url})

          if not children:
              continue

          if caption:
              nodes.append({'label': caption, 'children': children})
          else:
              nodes.extend(children)

      if nodes:
          with open(target, 'w', encoding='utf-8') as out:
              json.dump({'schema': 'docup.nav-fragment/1', 'nodes': nodes}, out)
      DOCUP_NAV_EOF
      python3 "$DOCUP_WORK_DIR/docup-nav.py" "$DOCUP_CONFIGURATION_DIR" "$DOCUP_WORK_DIR/nav.json" "$DOCUP_BUILDER" || true
      if [ -s "$DOCUP_WORK_DIR/nav.json" ]; then
        mkdir -p "$DOCUP_OUTPUT/nav"
        mv "$DOCUP_WORK_DIR/nav.json" "$DOCUP_OUTPUT/nav/nav.json"
      fi

  # SPEC 8.4.5's `pdf`, via LaTeX (SPEC 8.5.14's distribution, in
  # deploy/Dockerfile.sphinx).
  #
  # 🛑 `latexmk`, not Sphinx's own `latexpdf` target. That target shells out
  # to `make`, which shells out to `latexmk` — so `make` would be a third
  # interpreter in the image and one more layer between SPEC 8.4.10's
  # `set -euo pipefail` and the command that can fail. latexmk is what does
  # the work either way, and it is what handles the multi-pass run a
  # document with cross-references and an index needs: a single `pdflatex`
  # emits "Rerun to get cross-references right" and a PDF with `??` where
  # every reference should be, which is a green build and a broken download.
  #
  # 🛑 A SEPARATE doctree directory from `html`. Sphinx caches a parsed
  # doctree per builder and the latex builder's differs; sharing the
  # directory makes the second builder discard and reparse everything, which
  # is slower, and makes the output depend on which builder ran first.
  pdf:
    - >-
      sphinx-build -b latex $DOCUP_STRICT
      -d "$DOCUP_WORK_DIR/doctrees-latex"
      "$DOCUP_CONFIGURATION_DIR" "$DOCUP_WORK_DIR/latex"
    - >-
      cd "$DOCUP_WORK_DIR/latex" &&
      latexmk -pdf -dvi- -ps- -interaction=nonstopmode -halt-on-error
    # 🛑 `document.pdf`, which is SPEC 8.4.5's identifier-free leaf. Sphinx
    # names the file after `project` in conf.py, which is author-supplied and
    # is exactly the kind of value SPEC 8.8.1 forbids in a storage key. The
    # ingestor renames it anyway — a repository using `build.commands` never
    # runs this line — but writing it correctly here keeps the contract
    # visible in the build log rather than only in a PHP class.
    - mkdir -p "$DOCUP_OUTPUT/pdf"
    - cp "$DOCUP_WORK_DIR"/latex/*.pdf "$DOCUP_OUTPUT/pdf/document.pdf"

  # SPEC 8.4.5's `epub`. Pure Python, no distribution to install.
  epub:
    - >-
      sphinx-build -b epub $DOCUP_STRICT
      -d "$DOCUP_WORK_DIR/doctrees-epub"
      "$DOCUP_CONFIGURATION_DIR" "$DOCUP_WORK_DIR/epub"
    - mkdir -p "$DOCUP_OUTPUT/epub"
    - cp "$DOCUP_WORK_DIR"/epub/*.epub "$DOCUP_OUTPUT/epub/document.epub"

  # SPEC 8.4.5's `htmlzip`, identical in all seven presets because it does
  # not depend on the generator: it is the zip of the html tree this build
  # has already produced, which is why `html` is always first in
  # ToolchainPlan::formats().
  #
  # `-X` drops the extra attribute fields (uid, gid, platform metadata) that
  # would otherwise make two builds of one commit on two hosts differ.
  # SPEC 18.13's remaining gap is the stored mtimes, which zip has no flag
  # for — see `determinism` below.
  htmlzip:
    - mkdir -p "$DOCUP_OUTPUT/htmlzip"
    - cd "$DOCUP_OUTPUT" && zip -q -r -X htmlzip/document.zip html

determinism: >-
  Deterministic with SOURCE_DATE_EPOCH set, which this preset sets. Without it
  Sphinx writes a per-file "last updated" stamp taken from the working tree's
  mtimes, which a fresh clone regenerates on every build. `searchindex.js` is
  stable for a stable input set. Extensions that read the clock or the
  environment (sphinxcontrib-versioning, some changelog plugins) defeat the
  cache and must be listed per repository rather than worked around here.
  The offline formats are weaker and the difference is stated rather than
  elided. `pdf`: LaTeX stamps /CreationDate and /ModDate into the PDF trailer
  and an /ID derived from them, so two builds of one commit differ in those
  three fields and nowhere else; SOURCE_DATE_EPOCH is honoured by pdfTeX
  from TeX Live 2016 onward, which makes them stable here, and a distribution
  that ignored it would not. `epub`: Sphinx writes the same epoch into the
  OPF metadata, so it follows. `htmlzip`: `-X` removes the extra attribute
  fields, but zip has no flag for the stored mtimes, so the archive's bytes
  track the build container's clock even where its contents do not. None of
  the three affects the SPEC 8.5.19 fragment cache, which keys on inputs.
