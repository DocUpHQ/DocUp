# 🛑 Three pages are in `.docup.yaml`'s nav and missing from THIS one:
# `saml.md`, `directories.md` and `assurance.md`. Carried from Phase 27, which
# recorded them as owed.
#
# The consequence is narrower than it looks and worth stating so nobody fixes
# the wrong thing: SPEC 8.7.6 makes the `.docup.yaml` nav authoritative for the
# PUBLISHED site, so readers reach all three. What this nav drives is MkDocs'
# own sidebar when the guide is built locally — so the pages are reachable and
# unlisted in the local preview. Left as owed rather than fixed in passing,
# because each belongs in a section this nav does not have and guessing where
# an identity-federation page goes is how a manual grows a "Miscellaneous".
#
# Phase 29 added `search.md` to BOTH, because the phase wrote it.

# 🛑 Flat .html URLs, not MkDocs' default directory URLs.
#
# The `.docup.yaml` nav: this guide declares takes precedence over the
# fragment MkDocs emits (SPEC 8.7.6), so the two have to agree about what a
# page URL looks like — and under `use_directory_urls: true` they would not:
# the declared `installing.html` would name a file MkDocs never wrote.
# Phase 17 found this by writing the manual; see the build log.
use_directory_urls: false
