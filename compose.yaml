#
# The production-shaped stack (SPEC 8.1.1, 11.5 "minimal" profile).
#
# 🛑 SPEC 8.1.3: MailPit and phpMyAdmin are ABSENT FROM THIS FILE AS IMAGES, not
# merely disabled by a profile. A profile can be flipped by an operator in a
# hurry; a missing service cannot. They live in compose.dev.yaml, and a test
# asserts this file contains neither image name.
#
#   development:  docker compose -f compose.yaml -f compose.dev.yaml up
#   production:   docker compose up
#
# Five services, no external account required, per SPEC 8.1.1.

name: docup

services:

  # --- the application and the edge, in one container (SPEC 11.3, ADR 0001) ---
  # FrankenPHP/Caddy is the default edge driver because it preserves the
  # application's response headers through the artifact handoff natively, where
  # nginx replaces the whole set. nginx-accel is the CI-matrix alternative.
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    ports:
      - "${DOCUP_HTTP_PORT:-8080}:80"
      # 🛑 SPEC 8.10.16: no per-domain configuration and no reload, so this is
      # the only line a new custom domain needs — the listener answers whatever
      # SNI arrives and SPEC 8.10.11's permission endpoint decides.
      #
      # 🛑 SPEC 8.10.18's ACME challenge is answered on **port 80**, not here,
      # because an HTTP-01 validation reaches a name that has no certificate
      # yet. Publishing 443 without 80 would make every public issuance fail
      # with a validation error at the CA and nothing logged on this side.
      - "${DOCUP_HTTPS_PORT:-8443}:443"
    volumes:
      - .:/app
      - ./deploy/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - artifacts:/var/lib/docup/artifacts
      # The SPEC 8.5.13 spool. The application mounts it because the pipeline
      # runs wherever a build is driven from - a dashboard request, an API
      # call, or the test suite - and all three live here.
      - spool:/var/lib/docup/spool
    networks: [app, data]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-docup}
      DB_USERNAME: ${DB_USERNAME:-docup}
      DB_PASSWORD: ${DB_PASSWORD:-docup}
      REDIS_HOST: cache
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      DOCUP_APP_HOST: ${DOCUP_APP_HOST}
      DOCUP_DOCS_APEX: ${DOCUP_DOCS_APEX}
      DOCUP_RUNNER_SPOOL: /var/lib/docup/spool
      DOCUP_PREVIEW_APEX: ${DOCUP_PREVIEW_APEX}
      DOCUP_ASSET_HOST: ${DOCUP_ASSET_HOST}
      # 🛑 The same path the edge serves, and the same path the volume is
      # mounted at above. A store writing elsewhere makes every handoff point at
      # a file the edge cannot see.
      DOCUP_ARTIFACT_ROOT: /var/lib/docup/artifacts
      DOCUP_EDGE_DRIVER: ${DOCUP_EDGE_DRIVER:-caddy-intercept}
      # 🛑 SPEC 8.10.12 makes HTTPS on a served hostname a validation error and
      # App\Tls\PermissionEndpoint refuses to boot on one. Passed explicitly
      # rather than left to the config default so that an operator who needs to
      # change it edits one place and gets the refusal if they get it wrong —
      # the deadlock it prevents produces no log line anywhere.
      DOCUP_TLS_PERMISSION_ENDPOINT: ${DOCUP_TLS_PERMISSION_ENDPOINT:-http://127.0.0.1/_/edge/tls-permission}
      DOCUP_TLS_CERTIFICATE_ENDPOINT: ${DOCUP_TLS_CERTIFICATE_ENDPOINT:-http://127.0.0.1/_/edge/certificate}
      # SPEC 8.10.11's live-DNS target, and SPEC 8.10.8's A/AAAA advice. Empty
      # by default and that is honest: DocUp cannot discover its own public
      # address, so where this is unset the documentation apex is resolved
      # instead — which is what every CNAME in SPEC 8.10.8 points at anyway.
      DOCUP_INGRESS_ADDRESSES: ${DOCUP_INGRESS_ADDRESSES:-}
      # 🛑 SPEC 8.5.11's declaration. Read here as well as in the runner
      # because BuildServiceProvider refuses a production boot without it,
      # and an installation whose dashboard boots while its runner refuses
      # is one where the operator sees a working site and a silent queue.
      DOCUP_BUILD_ISOLATION: ${DOCUP_BUILD_ISOLATION:-}
      DOCUP_SANDBOX_EGRESS: ${DOCUP_SANDBOX_EGRESS:-allowlist}
      DOCUP_BUILDS_ENABLED: ${DOCUP_BUILDS_ENABLED:-true}
      DOCUP_SEARCH_DRIVER: ${DOCUP_SEARCH_DRIVER:-mysql_fulltext}
    healthcheck:
      # §8.1.10's liveness endpoint. It was `/up` until Phase 07, which
      # 404s: `withRouting(health:)` is ignored when `using:` is given,
      # so this container had reported unhealthy since Phase 01.
      test: ["CMD", "curl", "-fsS", "http://localhost/_/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  # --- MySQL 8.4 LTS (SPEC 11.1; 8.0 reached EOL in April 2026) ---
  db:
    image: mysql:8.4
    restart: unless-stopped
    # 🛑 SPEC 11.2: the `data` zone, and nothing else. `internal: true` on
    # that network is what makes "MUST NEVER be routable from the build
    # network" a property of the deployment rather than a promise - and
    # SPEC 8.5.12's boot self-test is what proves it on every start.
    networks: [data]
    command:
      - --innodb-buffer-pool-size=512M
      # SPEC 8.16.2 / ADR 0004: the three-character minimum token is the default
      # and is stated here so the search driver's documented limits are visible
      # in the deployment rather than only in the manual.
      - --innodb-ft-min-token-size=3
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-docup}
      MYSQL_USER: ${DB_USERNAME:-docup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-docup}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-docup-root}
    volumes:
      - db:/var/lib/mysql
      # 🛑 SPEC 8.22.1: makes the audit log append-only to the application and
      # creates the separate maintenance principal. The MySQL image runs
      # everything in /docker-entrypoint-initdb.d as root on FIRST
      # initialisation, which is the only point at which the application's own
      # user could not do it — a table-level REVOKE is inexpressible against a
      # schema grant, and CREATE TRIGGER needs SUPER while binary logging is on.
      #
      # 🛑 The `.sql` files are mounted OUT of that directory and applied by
      # the wrapper, which runs them with `--force`. First initialisation
      # happens against an EMPTY schema, so every statement naming a migrated
      # table fails there — and from 8.4.13 the image turns that into a
      # container that never starts. The wrapper is why the stack boots; it is
      # not why the log is hardened. See the script for the whole argument.
      #
      # On an existing installation neither runs, because the directory is only
      # read when the data volume is empty. Apply the script by hand there, and
      # on a fresh stack once it has migrated; `docup:doctor` fails until it
      # has been.
      - ./deploy/mysql/init:/opt/docup/mysql:ro
      - ./deploy/mysql/entrypoint:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-docup-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

      # 🛑 A start period, because FIRST initialisation here is not a plain
      # MySQL start. The image brings up a temporary server on a socket with
      # no TCP port, runs everything in `/docker-entrypoint-initdb.d` against
      # it - which for us is SPEC 8.22.1's append-only triggers and the
      # maintenance principal - then shuts it down and restarts properly.
      #
      # `mysqladmin ping -h 127.0.0.1` cannot succeed during that window, and
      # without a start period those failures count against `retries` from
      # the first second. On a loaded runner the shutdown-and-restart lands
      # inside the budget and the container is declared unhealthy while it is
      # still doing exactly what it is supposed to - which is how CI lost the
      # edge-driver job once, having passed on the same tree half an hour
      # earlier.
      #
      # 30s is generous against a measured ~15s first run. Health checks
      # during the period still count: the container goes healthy the moment
      # one succeeds, so this costs nothing on the restart path, where the
      # data directory already exists and MySQL is up in about two seconds.
      start_period: 30s

  # --- Valkey (SPEC 11.1: mandatory, and Valkey rather than Redis on the
  #     governance grounds recorded in that section) ---
  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks: [data]
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- the queue worker; becomes the build runner in Phase 06 ---
  # 🛑 SPEC 8.5.13: when builds arrive, the runner is the SOLE holder of the
  # container-runtime socket and no request-handling process may hold one. It is
  # a separate service from `app` for that reason, from the first phase, so the
  # boundary is never retrofitted.
  # --- the queue worker (SPEC 11.2 'app' zone) ---
  # 🛑 Renamed from `runner` in Phase 06. It holds the database credentials
  # and the APP_KEY, which SPEC 11.2 places in the app zone and which the
  # runner zone must not have - so calling this service `runner` while the
  # real runner has neither would have been the one name guaranteed to
  # mislead whoever next reads the trust-zone table.
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The app zone: it holds the credentials, so it sits where they belong.
    networks: [app, data]
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    command: ["php", "artisan", "queue:work", "--tries=1", "--max-time=3600"]
    # 🛑 This override is load-bearing. The FrankenPHP base image declares its
    # own HEALTHCHECK against Caddy's admin API on port 2019, and the worker
    # serves no HTTP at all - it is a queue worker. Inheriting it leaves the
    # container permanently "unhealthy", which is how it was found: anything
    # that waits on `condition: service_healthy` for the runner would wait for
    # ever, and a real failure here would be indistinguishable from the
    # permanent one.
    #
    # queue:monitor is used rather than a process check because it proves
    # something worth proving: the application boots and can reach the queue
    # backend. A process check would only say that PID 1 had not exited yet,
    # which Docker's restart policy already covers. procps is not installed in
    # the image, so pgrep is not available in any case.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "database:default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - .:/app
      - artifacts:/var/lib/docup/artifacts
      - spool:/var/lib/docup/spool
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-docup}
      DB_USERNAME: ${DB_USERNAME:-docup}
      DB_PASSWORD: ${DB_PASSWORD:-docup}
      REDIS_HOST: cache
      QUEUE_CONNECTION: database
      DOCUP_APP_HOST: ${DOCUP_APP_HOST}
      DOCUP_DOCS_APEX: ${DOCUP_DOCS_APEX}
      DOCUP_RUNNER_SPOOL: /var/lib/docup/spool
      DOCUP_BUILD_ISOLATION: ${DOCUP_BUILD_ISOLATION:-}
      DOCUP_SANDBOX_EGRESS: ${DOCUP_SANDBOX_EGRESS:-allowlist}
      DOCUP_BUILDS_ENABLED: ${DOCUP_BUILDS_ENABLED:-true}

  # --- the scheduler (SPEC 11.2 'app' zone) ---
  #
  # 🛑 Added in Phase 11, and it should have existed since Phase 02. Nothing
  # in this stack ran `schedule:work`, so every `Schedule::command()` in
  # routes/console.php was configuration with no process behind it: §8.22.1's
  # daily signed audit anchor — whose whole value is that a missing day is a
  # day that can be rewritten undetectably — and §8.22.6's MANDATORY hard
  # purge, which is the product's stated erasure latency floor. Both were
  # scheduled, reviewed, and never once executed in a deployment.
  #
  # Found while adding §8.5.3's per-version cron, which needs the same
  # process. Recorded here rather than only in the build log because the
  # failure mode is invisible: a scheduler that is absent looks exactly like
  # one with nothing due.
  #
  # A separate service from `worker` rather than a flag on it, because the
  # two scale differently: an operator running six workers for build
  # throughput must not get six schedulers writing six audit anchors. The
  # `onOneServer()` guards in routes/console.php need a cache lock to do
  # that, and one scheduler needs no lock at all.
  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    networks: [app, data]
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    command: ["php", "artisan", "schedule:work"]
    # The same override, for the same reason the worker needs it: the
    # FrankenPHP base image's HEALTHCHECK probes Caddy's admin API, and this
    # container serves no HTTP. `schedule:list` proves the application boots
    # and that the schedule is readable, which is what this process is for.
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - .:/app
      - artifacts:/var/lib/docup/artifacts
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-docup}
      DB_USERNAME: ${DB_USERNAME:-docup}
      DB_PASSWORD: ${DB_PASSWORD:-docup}
      REDIS_HOST: cache
      CACHE_STORE: redis
      QUEUE_CONNECTION: database
      DOCUP_APP_HOST: ${DOCUP_APP_HOST}
      DOCUP_DOCS_APEX: ${DOCUP_DOCS_APEX}
      DOCUP_AUDIT_KEY: ${DOCUP_AUDIT_KEY}

  # --- the build runner (SPEC 8.5.13, SPEC 11.2 'runner' zone) ---
  #
  # 🛑 "No request-handling or queue-worker process MUST hold a
  # container-runtime socket. The runner is the sole holder, and it MUST
  # accept only a typed run specification rendered through a fixed argv
  # template."
  #
  # 🛑 Phase 06's exit criterion, visible in this block: the environment below
  # contains NO DB_* variables and NO APP_KEY. It cannot read the database, it
  # cannot open an envelope-encrypted credential, and it cannot decrypt a
  # session cookie. What it can do is start containers - so a compromise of
  # the one process holding the socket yields no tenant data and no key.
  # `RunnerIsolationTest` asserts this against the file, because a comment
  # saying so is worth nothing the day somebody adds a variable "just to
  # debug something".
  runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.runner
    restart: unless-stopped
    command: ["php", "artisan", "docup:runner"]

    # 🛑 The socket, and the reason this service exists. Read-only: the runner
    # needs to create and remove containers, which the API allows over a
    # read-only bind of the socket file itself - the flag stops the socket
    # being replaced, not the calls being made.
    volumes:
      # 🛑 The application image carries no source - every service in this
      # file bind-mounts it, and the runner is no exception. What it does NOT
      # mount is the artifact volume: the runner never touches a published
      # byte, it hands the worker a tarball and the worker ingests it
      # (SPEC 8.21.6).
      - .:/app

      # 🛑 **`.env` is masked, and this is the difference between a claim and
      # a fact.** The environment block below carries no DB_* and no APP_KEY
      # — but every service bind-mounts the project directory, and Laravel's
      # dotenv loader reads `/app/.env` off the filesystem. So a runner with
      # a spotless compose environment could still read the database
      # password, which was measured and is what this line fixes.
      #
      # `RunnerIsolationTest` asserts the mask, because the hole it closes is
      # invisible from the environment block that looks like the answer.
      - /dev/null:/app/.env:ro

      - /var/run/docker.sock:/var/run/docker.sock:ro
      - spool:/var/lib/docup/spool

      # 🛑 SPEC 8.5.15 requires OOM to be read "authoritatively from cgroup
      # `memory.events:oom_kill`" rather than inferred from an exit code.
      # Read-only, and the whole hierarchy rather than one path, because
      # the layout differs between cgroup v1 and v2 and between the systemd
      # and cgroupfs drivers - `CgroupSampler` probes all four.
      #
      # Measured in Phase 07: a container's cgroup is REMOVED when it
      # exits, so this is sampled while the build runs. Without this mount
      # the runner falls back to the daemon's own OOM flag and says so;
      # what is lost is the kill COUNT and `pids.events:max`, which has no
      # daemon equivalent at all and is the only evidence a fork bomb
      # leaves behind.
      - /sys/fs/cgroup:/hostcg:ro

      # 🛑 The build workspaces, bind-mounted AT THE SAME PATH the host
      # knows them by. That is not a coincidence of naming: the runner is
      # itself a container, so a path it hands to `docker run -v` is
      # resolved by the daemon against the HOST - and binding the identical
      # path here is what makes one directory both "the workspace the build
      # writes to" and "a directory this process can measure".
      #
      # SPEC 8.5.18 requires an enforced disk limit and the kernel has no
      # portable way to give one here (ADR 0011 and `Workspace` record the
      # two that were measured and refused), so the runner polls the tree
      # while the build runs and kills a container that passes the cap.
      - ${DOCUP_WORKSPACE_ROOT:-/var/lib/docup/workspaces}:/var/lib/docup/workspaces
    working_dir: /app

    # 🛑 SPEC 11.2's `runner` zone, and the absence is the point: this
    # service is on NEITHER `data` NOR `app`. It cannot reach MySQL, it
    # cannot reach Valkey, and it cannot reach the application. What it can
    # do is talk to the container runtime over the socket above and read
    # the spool. The build containers it starts go on `sandboxes`, which it
    # is not on either.
    networks: [runner]

    # Proves it can reach the runtime, which is the only thing it does.
    # `queue:monitor` would need the database it deliberately cannot see.
    healthcheck:
      test: ["CMD", "docker", "version", "--format", "{{.Server.Version}}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    environment:
      APP_ENV: ${APP_ENV:-production}
      DOCUP_RUNNER_SPOOL: /var/lib/docup/spool
      # Needed only because AppServiceProvider asserts the SPEC 8.1.4 origin
      # separation at boot. Hostnames, not credentials.
      DOCUP_APP_HOST: ${DOCUP_APP_HOST}
      DOCUP_DOCS_APEX: ${DOCUP_DOCS_APEX}

  # --- the egress proxy (SPEC 8.5.9, SPEC 11.2 'egress' zone) -------------
  #
  # 🛑 "Egress MUST default to an allowlisted CONNECT proxy (PyPI, npm,
  # crates.io, `proxy.golang.org`, rubygems.org, configured git hosts,
  # operator additions) plus an nftables backstop inside the build network
  # namespace so proxy bypass still fails at layer 3. TLS MUST NOT be
  # intercepted."
  #
  # It is the ONLY service on both `sandboxes` and `egress`, and that is the
  # whole topology: `sandboxes` is `internal: true`, so a build container has
  # no route off this host except through this one address - and the warden's
  # nftables ruleset narrows that to this address at this port, which also
  # closes the route to a SIBLING build that `internal` leaves open.
  #
  # The allowlist is a file, deliberately (ADR 0011): the proxy renders its
  # configuration from it at start-up and the application reads the same file
  # for `docup:doctor` and the user-facing refusal message, so the list an
  # author is told about is the list actually enforced.
  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    restart: unless-stopped

    # 🛑 How the runner finds it. A label rather than a container name,
    # because the name depends on the compose project name and a renamed
    # project would leave every build with no egress at all - failing closed,
    # but silently and for the wrong reason.
    labels:
      docup.role: egress-proxy

    networks: [sandboxes, egress]

    # Holds no credentials, mounts no volume, publishes no port. An operator
    # editing the allowlist edits the file and restarts this service.
    volumes:
      - ./deploy/egress-allowlist.conf:/etc/docup/egress-allowlist.conf:ro

    # 🛑 The proxy is reachable by code the installation did not write, so it
    # gets the same hardening as a build container. It needs no capabilities
    # at all: it binds 3128 as an unprivileged port, as an unprivileged user.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # 🛑 uid 31 is the `squid` user in the image, read from the image rather
    # than guessed - a tmpfs mounted with the wrong owner is a container that
    # restart-loops on "Permission denied" from a path the Dockerfile chowned
    # correctly, which reads like anything but a mount option.
    #
    # The generated configuration lands in `/var/run/squid` rather than in
    # `/etc/squid`: a tmpfs over the package's own directory hides `mime.conf`
    # and squid exits citing a missing MIME table, which reads like a broken
    # image rather than a mount option. This way the root filesystem stays
    # read-only AND the rendered policy exists only in memory, so an operator
    # cannot edit it in place and have the edit survive - the allowlist file
    # is the only way in, which is the property ADR 0011 wanted.
    tmpfs:
      - /var/run/squid:rw,noexec,nosuid,nodev,uid=31,gid=31,mode=0700
      - /var/log/squid:rw,noexec,nosuid,nodev,uid=31,gid=31,mode=0700
      - /var/cache/squid:rw,noexec,nosuid,nodev,uid=31,gid=31,mode=0700

    healthcheck:
      # A CONNECT to a host that is NOT on the allowlist must be refused.
      # Checking that the port answers would pass on a proxy that had lost
      # its policy entirely, which is the failure worth detecting. The check
      # is a script in the image rather than a one-liner here, because the
      # request needs CRLF and YAML reads those escapes as its own - the
      # first version of this line sent a malformed request and reported a
      # working proxy permanently unhealthy.
      test: ["CMD", "docup-proxy-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  # 🛑 SPEC 11.2's five trust zones, "enforced by compose networks, not
  # convention". The two `internal: true` declarations are the enforcement:
  # Docker gives an internal network no gateway and no NAT, so nothing on it
  # has a route off this host.
  app:
  runner:
  egress:

  data:
    internal: true

  sandboxes:
    internal: true

    # Named explicitly because the runner has to pass this name to
    # `docker run --network` for every build container it starts, and
    # compose's default name is <project>_<network> - which changes when an
    # operator renames their project. `config/builds.php` carries the same
    # default and `docup:doctor` reports a mismatch.
    name: docup_sandboxes

volumes:
  db:
  cache:
  artifacts:
  # The SPEC 8.5.13 exchange between the worker and the runner. A named volume
  # rather than a bind: the two containers are the only things that mount it.
  spool:
