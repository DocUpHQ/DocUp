#
# The production-shaped stack (SPEC 8.1.1, 11.5 "minimal" profile).
#
# 🛑 SPEC 8.1.3: MailPit and phpMyAdmin are ABSENT FROM THIS FILE AS IMAGES, not
# merely disabled by a profile. A profile can be flipped by an operator in a
# hurry; a missing service cannot. They live in compose.dev.yaml, and a test
# asserts this file contains neither image name.
#
#   development:  docker compose -f compose.yaml -f compose.dev.yaml up
#   production:   docker compose up
#
# Five services, no external account required, per SPEC 8.1.1.

name: docup

services:

  # --- the application and the edge, in one container (SPEC 11.3, ADR 0001) ---
  # FrankenPHP/Caddy is the default edge driver because it preserves the
  # application's response headers through the artifact handoff natively, where
  # nginx replaces the whole set. nginx-accel is the CI-matrix alternative.
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    ports:
      - "${DOCUP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/app
      - ./deploy/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - artifacts:/var/lib/docup/artifacts
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-docup}
      DB_USERNAME: ${DB_USERNAME:-docup}
      DB_PASSWORD: ${DB_PASSWORD:-docup}
      REDIS_HOST: cache
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      DOCUP_APP_HOST: ${DOCUP_APP_HOST}
      DOCUP_DOCS_APEX: ${DOCUP_DOCS_APEX}
      DOCUP_PREVIEW_APEX: ${DOCUP_PREVIEW_APEX}
      DOCUP_ASSET_HOST: ${DOCUP_ASSET_HOST}
      DOCUP_EDGE_DRIVER: ${DOCUP_EDGE_DRIVER:-caddy-intercept}
      DOCUP_SEARCH_DRIVER: ${DOCUP_SEARCH_DRIVER:-mysql_fulltext}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  # --- MySQL 8.4 LTS (SPEC 11.1; 8.0 reached EOL in April 2026) ---
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=512M
      # SPEC 8.16.2 / ADR 0004: the three-character minimum token is the default
      # and is stated here so the search driver's documented limits are visible
      # in the deployment rather than only in the manual.
      - --innodb-ft-min-token-size=3
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-docup}
      MYSQL_USER: ${DB_USERNAME:-docup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-docup}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-docup-root}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-docup-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Valkey (SPEC 11.1: mandatory, and Valkey rather than Redis on the
  #     governance grounds recorded in that section) ---
  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- the queue worker; becomes the build runner in Phase 06 ---
  # 🛑 SPEC 8.5.13: when builds arrive, the runner is the SOLE holder of the
  # container-runtime socket and no request-handling process may hold one. It is
  # a separate service from `app` for that reason, from the first phase, so the
  # boundary is never retrofitted.
  runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    command: ["php", "artisan", "queue:work", "--tries=1", "--max-time=3600"]
    # 🛑 This override is load-bearing. The FrankenPHP base image declares its
    # own HEALTHCHECK against Caddy's admin API on port 2019, and the runner
    # serves no HTTP at all - it is a queue worker. Inheriting it leaves the
    # container permanently "unhealthy", which is how it was found: anything
    # that waits on `condition: service_healthy` for the runner would wait for
    # ever, and a real failure here would be indistinguishable from the
    # permanent one.
    #
    # queue:monitor is used rather than a process check because it proves
    # something worth proving: the application boots and can reach the queue
    # backend. A process check would only say that PID 1 had not exited yet,
    # which Docker's restart policy already covers. procps is not installed in
    # the image, so pgrep is not available in any case.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "database:default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - .:/app
      - artifacts:/var/lib/docup/artifacts
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-docup}
      DB_USERNAME: ${DB_USERNAME:-docup}
      DB_PASSWORD: ${DB_PASSWORD:-docup}
      REDIS_HOST: cache
      QUEUE_CONNECTION: database
      DOCUP_APP_HOST: ${DOCUP_APP_HOST}
      DOCUP_DOCS_APEX: ${DOCUP_DOCS_APEX}

volumes:
  db:
  cache:
  artifacts:
